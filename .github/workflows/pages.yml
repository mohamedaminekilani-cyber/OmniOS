name: Deploy Second Brain live

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: second-brain-live-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regression checks
        run: npm test && npm run test:runtime

  deploy-live:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build exact live release
        run: npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Verify release belongs to this commit
        run: |
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('dist/release.json','utf8'));if(r.commit!==process.env.GITHUB_SHA)throw new Error('release commit mismatch: '+r.commit+' != '+process.env.GITHUB_SHA);console.log('Deploying commit',r.commit,'as',r.file)"
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload exact live build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy exact commit to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
