<!DOCTYPE html>

<head>

<meta name="apple-touch-fullscreen" content="yes">

<title>OmniOS v62.2 — Clean Startup</title>
<script id="omnios-v622-boot-early">
(function(){
  const root=document.documentElement;
  root.classList.add('omnios-booting','omnios-no-first-motion');
  root.dataset.omniosBoot='loading';
})();
</script>
<style id="omnios-v622-boot-css">
html.omnios-booting body{overflow:hidden!important;background:var(--bg-base,#0f0f11)!important}
html.omnios-booting body>*:not(#omnios-boot-screen){visibility:hidden!important;opacity:0!important;pointer-events:none!important}
html.omnios-no-first-motion *,html.omnios-no-first-motion *::before,html.omnios-no-first-motion *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
#omnios-boot-screen{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;visibility:visible!important;opacity:1!important;pointer-events:auto;background:var(--bg-base,#0f0f11);color:var(--text-primary,#f4f4f5);font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;transition:opacity .18s ease!important}
#omnios-boot-screen.is-leaving{opacity:0!important;pointer-events:none!important}
.omnios-boot-card{width:min(330px,calc(100vw - 42px));display:flex;flex-direction:column;align-items:center;text-align:center;gap:13px}
.omnios-boot-mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--bg-surface,#18181b);border:1px solid var(--border-light,#3f3f46);box-shadow:0 12px 38px rgba(0,0,0,.22);font-size:0}
.omnios-boot-mark::before{content:'';width:21px;height:21px;border:2px solid color-mix(in srgb,var(--accent-cyan,#06b6d4) 30%,transparent);border-top-color:var(--accent-cyan,#06b6d4);border-radius:50%;animation:omniosBootSpin .8s linear infinite!important}
.omnios-boot-brand{font-size:1.08rem;font-weight:820;letter-spacing:-.025em}.omnios-boot-brand span{color:var(--accent-cyan,#06b6d4)}
.omnios-boot-copy{font-size:.72rem;line-height:1.45;color:var(--text-muted,#71717a)}
.omnios-boot-track{width:180px;height:3px;border-radius:99px;overflow:hidden;background:var(--bg-elevated,#27272a)}
.omnios-boot-track i{display:block;width:38%;height:100%;border-radius:inherit;background:var(--accent-cyan,#06b6d4);animation:omniosBootBar 1.05s ease-in-out infinite!important}
@keyframes omniosBootSpin{to{transform:rotate(360deg)}}
@keyframes omniosBootBar{0%{transform:translateX(-115%)}55%{transform:translateX(155%)}100%{transform:translateX(300%)}}
@media(prefers-reduced-motion:reduce){.omnios-boot-mark::before,.omnios-boot-track i{animation:none!important}.omnios-boot-track i{width:100%}}
</style>
<style>
    :root {
        --bg-base: #0f0f11;
        --bg-surface: #18181b;
        --bg-elevated: #27272a;
        --bg-hover: #3f3f46;
        --border-color: #27272a;
        --border-light: #3f3f46;
        --text-primary: #f4f4f5;
        --text-secondary: #a1a1aa;
        --text-muted: #71717a;
        --accent-cyan: #06b6d4;
        --accent-purple: #a855f7;
        --accent-green: #10b981;
        --accent-red: #ef4444;
        --accent-yellow: #f59e0b;
        --accent-blue: #3b82f6;
        --accent-pink: #ec4899;
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 16px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg-base); color: var(--text-primary);
        display: flex; height: 100vh; overflow: hidden;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 10px; }

    /* Sidebar */
    .sidebar {
        width: 240px; background: var(--bg-surface); border-right: 1px solid var(--border-color);
        display: flex; flex-direction: column; padding: 18px 0; flex-shrink: 0;
    }
    .logo { padding: 0 20px 16px; border-bottom: 1px solid var(--border-color); margin-bottom: 12px; }
    .logo h1 { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.5px; }
    .logo h1 span { color: var(--accent-cyan); }
    .logo p { font-size: 0.68rem; color: var(--text-muted); margin-top: 2px; }
    .nav-menu { flex: 1; padding: 0 10px; overflow-y: auto; }
    .nav-item {
        display: flex; align-items: center; gap: 10px; padding: 9px 12px;
        border-radius: var(--radius-md); color: var(--text-secondary); cursor: pointer;
        transition: all 0.15s; margin-bottom: 2px; font-size: 0.82rem; font-weight: 500;
        user-select: none;
    }
    .nav-item:hover { background: var(--bg-elevated); color: var(--text-primary); }
    .nav-item.active { background: rgba(6,182,212,0.12); color: var(--accent-cyan); font-weight: 600; }
    .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
    .nav-section { font-size: 0.62rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; padding: 10px 12px 4px; font-weight: 600; }
    .sidebar-footer { padding: 10px 12px; border-top: 1px solid var(--border-color); display: flex; gap: 6px; }
    .sidebar-footer .btn { flex: 1; justify-content: center; }

    /* Main */
    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .topbar {
        height: 54px; border-bottom: 1px solid var(--border-color);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 22px; background: var(--bg-surface); flex-shrink: 0;
    }
    .topbar-title { font-size: 1.05rem; font-weight: 600; }
    .topbar-actions { display: flex; gap: 8px; align-items: center; }

    .btn {
        padding: 7px 13px; border-radius: var(--radius-sm); border: 1px solid var(--border-light);
        background: var(--bg-elevated); color: var(--text-primary); font-size: 0.78rem;
        font-weight: 500; cursor: pointer; transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px;
        user-select: none;
    }
    .btn:hover { background: var(--bg-hover); }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent-cyan); color: #000; border-color: var(--accent-cyan); font-weight: 600; }
    .btn-primary:hover { background: #0891b2; }
    .btn-danger { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }
    .btn-danger:hover { background: #dc2626; }
    .btn-sm { padding: 5px 9px; font-size: 0.72rem; }

    .view-container { flex: 1; overflow-y: auto; padding: 22px; }
    .view { display: none; }
    .view.active { display: block; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

    /* Toolbar */
    .toolbar {
        display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px;
        padding: 10px 14px; background: var(--bg-surface); border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
    }
    .toolbar-group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    .toolbar-divider { width: 1px; height: 22px; background: var(--border-light); margin: 0 4px; }
    .view-btn {
        padding: 5px 9px; border-radius: var(--radius-sm); border: 1px solid transparent;
        background: transparent; color: var(--text-muted); cursor: pointer; font-size: 0.73rem;
        font-weight: 500; transition: all 0.15s; user-select: none;
    }
    .view-btn:hover { color: var(--text-primary); background: var(--bg-elevated); }
    .view-btn.active { color: var(--accent-cyan); background: rgba(6,182,212,0.1); border-color: rgba(6,182,212,0.3); }
    .filter-select {
        padding: 5px 8px; background: var(--bg-base); border: 1px solid var(--border-color);
        border-radius: var(--radius-sm); color: var(--text-primary); font-size: 0.73rem; cursor: pointer;
    }
    .filter-select:focus { outline: none; border-color: var(--accent-cyan); }

    /* Stats */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 18px; }
    .stat-card {
        background: var(--bg-surface); border: 1px solid var(--border-color);
        border-radius: var(--radius-md); padding: 14px; display: flex; flex-direction: column; gap: 3px;
    }
    .stat-label { font-size: 0.68rem; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-value { font-size: 1.5rem; font-weight: 700; }
    .stat-value.cyan { color: var(--accent-cyan); }
    .stat-value.green { color: var(--accent-green); }
    .stat-value.red { color: var(--accent-red); }
    .stat-value.purple { color: var(--accent-purple); }
    .stat-value.yellow { color: var(--accent-yellow); }

    /* Cards */
    .card {
        background: var(--bg-surface); border: 1px solid var(--border-color);
        border-radius: var(--radius-lg); padding: 18px;
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .card-title { font-size: 0.92rem; font-weight: 600; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 18px; }

    /* Forms */
    .form-group { margin-bottom: 12px; }
    .form-label { display: block; font-size: 0.76rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 5px; }
    .form-input, .form-select, .form-textarea {
        width: 100%; padding: 8px 11px; background: var(--bg-base); border: 1px solid var(--border-color);
        border-radius: var(--radius-sm); color: var(--text-primary); font-size: 0.83rem; transition: border 0.15s;
        font-family: inherit;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--accent-cyan); }
    .form-textarea { resize: vertical; min-height: 60px; }
    .form-row { display: flex; gap: 10px; }
    .form-row > * { flex: 1; }
    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .form-group label { display:block; font-size:.76rem; font-weight:500; color:var(--text-secondary); margin-bottom:5px; }
    @media(max-width:640px){ .form-grid { grid-template-columns:1fr; } }

    /* Kanban */
    .kanban-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; min-height: 400px; }
    .kanban-col {
        background: var(--bg-surface); border: 1px solid var(--border-color);
        border-radius: var(--radius-md); padding: 12px; display: flex; flex-direction: column;
    }
    .kanban-col-header { font-weight: 600; font-size: 0.82rem; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .kanban-col-header .count { background: var(--bg-elevated); padding: 2px 7px; border-radius: 10px; font-size: 0.68rem; color: var(--text-muted); }
    .kanban-cards { flex: 1; display: flex; flex-direction: column; gap: 7px; overflow-y: auto; }
    .kanban-card {
        background: var(--bg-elevated); border: 1px solid var(--border-color);
        padding: 11px; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s;
    }
    .kanban-card:hover { border-color: var(--accent-cyan); transform: translateY(-1px); }
    .kanban-card-title { font-size: 0.83rem; font-weight: 500; margin-bottom: 5px; }
    .kanban-card-meta { display: flex; gap: 5px; flex-wrap: wrap; }

    /* Tags */
    .tag { padding: 2px 6px; border-radius: 4px; font-size: 0.63rem; font-weight: 600; display: inline-block; }
    .tag-high { background: rgba(239,68,68,0.15); color: var(--accent-red); }
    .tag-med { background: rgba(245,158,11,0.15); color: var(--accent-yellow); }
    .tag-low { background: rgba(16,185,129,0.15); color: var(--accent-green); }
    .tag-cat { background: rgba(59,130,246,0.15); color: var(--accent-blue); }
    .tag-urgent { background: rgba(239,68,68,0.15); color: var(--accent-red); }
    .tag-not-urgent { background: rgba(113,113,122,0.2); color: var(--text-muted); }

    /* List View */
    .list-view { display: flex; flex-direction: column; gap: 5px; }
    .list-item {
        display: flex; align-items: center; gap: 10px; padding: 10px 14px;
        background: var(--bg-surface); border: 1px solid var(--border-color);
        border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s;
    }
    .list-item:hover { border-color: var(--accent-cyan); }
    .list-item.completed .list-item-title { text-decoration: line-through; color: var(--text-muted); }
    .list-item-check {
        width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--border-light);
        cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        transition: all 0.15s;
    }
    .list-item-check.checked { background: var(--accent-green); border-color: var(--accent-green); color: #000; font-size: 0.65rem; font-weight: bold; }
    .list-item-title { flex: 1; font-size: 0.83rem; font-weight: 500; }
    .list-item-date { font-size: 0.7rem; color: var(--text-muted); }

    /* Gallery */
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .gallery-card {
        background: var(--bg-surface); border: 1px solid var(--border-color);
        border-radius: var(--radius-md); padding: 16px; cursor: pointer; transition: all 0.15s;
        border-top: 3px solid var(--accent-cyan);
    }
    .gallery-card:hover { transform: translateY(-2px); border-color: var(--accent-cyan); }
    .gallery-card.priority-high { border-top-color: var(--accent-red); }
    .gallery-card.priority-med { border-top-color: var(--accent-yellow); }
    .gallery-card.priority-low { border-top-color: var(--accent-green); }
    .gallery-card-title { font-weight: 600; margin-bottom: 6px; font-size: 0.88rem; }
    .gallery-card-cat { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 6px; }
    .gallery-card-footer { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }

    /* Eisenhower Matrix */
    .eisenhower-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; min-height: 400px; }
    .eq-box {
        background: var(--bg-surface); border: 1px solid var(--border-color);
        border-radius: var(--radius-md); padding: 12px; display: flex; flex-direction: column; overflow: hidden;
    }
    .eq-box-header { font-weight: 600; font-size: 0.8rem; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .eq-box-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }

    /* Calendar Container & Views */
    .calendar-container { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 14px; }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
    .calendar-nav { display: flex; gap: 6px; align-items: center; }
    .calendar-nav button { background: var(--bg-elevated); border: 1px solid var(--border-color); color: var(--text-primary); padding: 5px 9px; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.75rem; }
    .calendar-nav button:hover { background: var(--bg-hover); }
    .calendar-month-title { font-size: 1rem; font-weight: 600; }
    
    /* Calendar Sub-views toggle */
    .cal-subview-btns { display: flex; gap: 2px; background: var(--bg-base); padding: 2px; border-radius: var(--radius-sm); border: 1px solid var(--border-color); }
    .cal-subview-btn { padding: 4px 10px; font-size: 0.7rem; border: none; background: transparent; color: var(--text-muted); border-radius: 4px; cursor: pointer; font-weight: 500; }
    .cal-subview-btn.active { background: var(--accent-cyan); color: #000; font-weight: 600; }

    /* Month Grid */
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
    .calendar-day-header { text-align: center; font-size: 0.65rem; color: var(--text-muted); font-weight: 600; padding: 6px 0; text-transform: uppercase; }
    .calendar-day {
        min-height: 80px; background: var(--bg-base); border: 1px solid var(--border-color);
        border-radius: 3px; padding: 4px; font-size: 0.65rem; cursor: pointer; transition: all 0.15s;
    }
    .calendar-day:hover { border-color: var(--accent-cyan); }
    .calendar-day.today { border-color: var(--accent-cyan); background: rgba(6,182,212,0.05); }
    .calendar-day.other-month { opacity: 0.3; }
    .calendar-day-num { font-weight: 600; margin-bottom: 3px; color: var(--text-secondary); }
    .calendar-day.today .calendar-day-num { color: var(--accent-cyan); }
    .calendar-event {
        padding: 2px 4px; border-radius: 3px; font-size: 0.6rem; margin-bottom: 2px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
    }
    .calendar-event.cat-work { background: rgba(59,130,246,0.2); color: var(--accent-blue); }
    .calendar-event.cat-hobby { background: rgba(168,85,247,0.2); color: var(--accent-purple); }
    .calendar-event.cat-routine { background: rgba(16,185,129,0.2); color: var(--accent-green); }
    .calendar-event.cat-gym { background: rgba(239,68,68,0.2); color: var(--accent-red); }
    .calendar-event.cat-meal { background: rgba(245,158,11,0.2); color: var(--accent-yellow); }

    /* Week & Day Views */
    .cal-week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; min-height: 400px; }
    .cal-week-col { background: var(--bg-base); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 8px; display: flex; flex-direction: column; }
    .cal-week-header { text-align: center; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; margin-bottom: 8px; }
    .cal-week-dayname { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .cal-week-daynum { font-size: 0.9rem; font-weight: 700; color: var(--text-primary); }
    .cal-week-col.today { border-color: var(--accent-cyan); background: rgba(6,182,212,0.03); }
    .cal-week-col.today .cal-week-daynum { color: var(--accent-cyan); }

    .cal-day-view-container { max-width: 600px; margin: 0 auto; background: var(--bg-base); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 16px; }
    .cal-day-header { border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 12px; font-weight: 700; font-size: 1.1rem; }

    /* Budget */
    .budget-progress { margin-bottom: 12px; cursor: pointer; padding: 10px; border-radius: var(--radius-sm); transition: background 0.15s; }
    .budget-progress:hover { background: var(--bg-elevated); }
    .budget-progress-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.8rem; }
    .progress-bar-bg { height: 7px; background: var(--bg-base); border-radius: 4px; overflow: hidden; }
    .progress-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }

    .transaction-list { max-height: 400px; overflow-y: auto; }
    .transaction-item {
        display: flex; justify-content: space-between; align-items: center;
        padding: 9px 0; border-bottom: 1px solid var(--border-color); cursor: pointer;
    }
    .transaction-item:hover { background: var(--bg-elevated); margin: 0 -8px; padding: 9px 8px; border-radius: var(--radius-sm); }
    .transaction-item:last-child { border-bottom: none; }
    .txn-left { display: flex; align-items: center; gap: 9px; }
    .txn-icon { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.95rem; }
    .txn-icon.income { background: rgba(16,185,129,0.15); color: var(--accent-green); }
    .txn-icon.expense { background: rgba(239,68,68,0.15); color: var(--accent-red); }
    .txn-amount.income { color: var(--accent-green); font-weight: 600; font-size: 0.82rem; }
    .txn-amount.expense { color: var(--accent-red); font-weight: 600; font-size: 0.82rem; }

    /* Habits Month */
    .habit-month-card {
        background: var(--bg-surface); border: 1px solid var(--border-color);
        border-radius: var(--radius-lg); padding: 18px; margin-bottom: 14px;
    }
    .habit-month-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 8px; }
    .habit-month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .habit-month-day-header { text-align: center; font-size: 0.62rem; color: var(--text-muted); font-weight: 600; padding: 3px; text-transform: uppercase; }
    .habit-month-day {
        aspect-ratio: 1; background: var(--bg-base); border: 1px solid var(--border-color);
        border-radius: 3px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-size: 0.68rem; cursor: pointer; transition: all 0.15s; position: relative;
    }
    .habit-month-day:hover { border-color: var(--accent-cyan); }
    .habit-month-day.completed { background: rgba(16,185,129,0.2); border-color: var(--accent-green); }
    .habit-month-day.completed::after { content: '✓'; position: absolute; bottom: 1px; right: 2px; font-size: 0.5rem; color: var(--accent-green); font-weight: bold; }
    .habit-month-day.today { border-color: var(--accent-cyan); }
    .habit-month-day.other-month { opacity: 0.25; }
