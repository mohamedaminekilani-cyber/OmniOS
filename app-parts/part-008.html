  if(view==='dashboard'){if(o.columns==='2')sec.classList.add('v34-dashboard-cols-2');if(o.columns==='1')sec.classList.add('v34-dashboard-cols-1');if(o.showDatabase===false)sec.classList.add('v34-hide-database');if(o.showDescriptions===false)sec.classList.add('v34-hide-dashboard-descriptions')}
  if(view==='master-calendar'){if(o.showLegend===false)sec.classList.add('v34-hide-calendar-legend');if(o.compactEvents)sec.classList.add('v34-compact-events')}
  if(view==='tasks'){if(o.showMetadata===false)sec.classList.add('v34-hide-task-meta');if(o.showFilters===false)sec.classList.add('v34-hide-task-filters')}
  if(view==='budget'){if(o.showStats===false)sec.classList.add('v34-hide-budget-stats');if(o.showWallets===false)sec.classList.add('v34-hide-wallets');if(o.compactTransactions)sec.classList.add('v34-compact-transactions');document.getElementById('wallet-list')?.closest('.card')?.classList.add('budget-wallet-card-v34')}
  if(view==='habits'){if(o.showSummary===false)sec.classList.add('v34-hide-habit-summary');if(o.showStreaks===false)sec.classList.add('v34-hide-habit-streaks')}
  if(view==='workout'){if(o.showKpis===false)sec.classList.add('v34-hide-workout-kpis');if(o.showImages===false)sec.classList.add('v34-hide-workout-images');if(o.compactSession)sec.classList.add('v34-compact-workout')}
  if(view==='focus'&&o.showSettings===false)sec.classList.add('v34-hide-focus-settings');
  if(view==='notes'){if(o.layout==='list')sec.classList.add('v34-notes-list');if(o.showPreviews===false)sec.classList.add('v34-hide-note-preview')}
  if(view==='passwords'&&o.layout==='list')sec.classList.add('v34-password-list');
  if(view==='diet'){if(o.layout==='list')sec.classList.add('v34-generic-list');if(o.showDetails===false)sec.classList.add('v34-hide-diet-details')}
  if(['wishlist','grocery','goals','pantry','templates'].includes(view)&&o.layout==='list')sec.classList.add('v34-generic-list');
}
function applyAllV34(){document.querySelectorAll('.view[id^="view-"]').forEach(sec=>applyViewOptionsV34(sec.id.replace(/^view-/,'')))}

/* ---------- repaired Habit month renderer ---------- */
function weekStartIndexV34(){return getSetting('calendar.weekStart','sunday')==='monday'?1:0}
function weekdayLabelsV34(){return weekStartIndexV34()===1?['Mon','Tue','Wed','Thu','Fri','Sat','Sun']:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']}
function monthOffsetV34(y,m){const dow=new Date(y,m,1,12).getDay();return weekStartIndexV34()===1?(dow+6)%7:dow}
window.renderHabitSummary=function(){
  const monthly=habitView==='calendar';const s=habitStats(monthly?'month':'week');const el=document.getElementById('habit-summary');if(!el)return;
  el.innerHTML=`<div class="habit-summary"><div class="habit-summary-label">${monthly?'Monthly':'Weekly'} consistency</div><div class="habit-summary-value">${s.rate}%</div></div><div class="habit-summary"><div class="habit-summary-label">Today</div><div class="habit-summary-value">${s.todayDone}/${s.todayTotal}</div></div><div class="habit-summary"><div class="habit-summary-label">Best streak</div><div class="habit-summary-value">🔥 ${s.best}d</div></div><div class="habit-summary"><div class="habit-summary-label">Active streak</div><div class="habit-summary-value">⚡ ${s.current}d</div></div>`;
};
function habitMonthHeaderV34(){return `<div class="v34-habit-month-toolbar"><div class="v34-habit-month-nav"><button type="button" class="btn btn-sm" id="habit-prev" aria-label="Previous month">‹</button><button type="button" class="btn btn-sm" id="habit-today">Today</button><button type="button" class="btn btn-sm" id="habit-next" aria-label="Next month">›</button></div><div class="v34-habit-month-title">${new Date(habitYear,habitMonth,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div><div class="text-muted text-sm">Click a day to toggle completion · right-click for actions</div></div>`}
function bindHabitMonthNavV34(){document.getElementById('habit-prev')?.addEventListener('click',()=>changeHabitMonth(-1));document.getElementById('habit-next')?.addEventListener('click',()=>changeHabitMonth(1));document.getElementById('habit-today')?.addEventListener('click',goToHabitToday);bindHabitDayClicks()}
function renderHabitMonthCardsV34(container){
  const days=new Date(habitYear,habitMonth+1,0).getDate(),offset=monthOffsetV34(habitYear,habitMonth),labels=weekdayLabelsV34(),today=localDateString();let html=`<div class="v34-habit-month-shell">${habitMonthHeaderV34()}<div class="v34-habit-month-cards">`;
  state.habits.forEach(h=>{const completed=Array.from({length:days},(_,i)=>`${habitYear}-${String(habitMonth+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`).filter(k=>h.log?.[k]).length;const rate=Math.round(completed/days*100);html+=`<section class="v34-habit-month-card" data-habit-id="${escapeHtml(String(h.id))}"><div class="v34-habit-month-card-head"><span style="font-size:1.1rem">${escapeHtml(h.icon||'✨')}</span><div class="v34-habit-month-name">${escapeHtml(h.name||'Habit')}</div><div class="v34-habit-month-meta"><strong>${completed}/${days}</strong> · ${rate}%<div class="v34-habit-streak">🔥 ${getStreak(h)}d</div></div></div><div class="v34-habit-mini-calendar">${labels.map(x=>`<div class="v34-habit-weekday">${x}</div>`).join('')}${'<div class="v34-habit-blank"></div>'.repeat(offset)}`;for(let day=1;day<=days;day++){const k=`${habitYear}-${String(habitMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,done=!!h.log?.[k];html+=`<button type="button" class="v34-habit-month-day ${done?'is-done':''} ${k===today?'is-today':''}" data-habit-day="${escapeHtml(String(h.id))}|${k}" title="${escapeHtml(h.name)} · ${k} · ${done?'Completed':'Not completed'}"><span>${day}</span>${done?'<span class="v34-dot">●</span>':''}</button>`}html+='</div></section>'});html+='</div></div>';container.innerHTML=html;bindHabitMonthNavV34()
}
function renderHabitMonthMatrixV34(container){
  const days=new Date(habitYear,habitMonth+1,0).getDate(),today=localDateString();let html=`<div class="v34-habit-month-shell">${habitMonthHeaderV34()}<div class="v34-habit-matrix-wrap"><div class="v34-habit-matrix" style="grid-template-columns:180px repeat(${days},35px)"><div class="v34-habit-matrix-cell v34-habit-matrix-head v34-habit-matrix-name">Habit</div>`;for(let d=1;d<=days;d++){const dt=new Date(habitYear,habitMonth,d);html+=`<div class="v34-habit-matrix-cell v34-habit-matrix-head" title="${dt.toLocaleDateString()}">${d}<br><span style="font-size:.5rem">${dt.toLocaleDateString(undefined,{weekday:'narrow'})}</span></div>`}state.habits.forEach(h=>{html+=`<div class="v34-habit-matrix-cell v34-habit-matrix-name" data-habit-id="${escapeHtml(String(h.id))}">${escapeHtml(h.icon||'✨')} ${escapeHtml(h.name||'Habit')}</div>`;for(let d=1;d<=days;d++){const k=`${habitYear}-${String(habitMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,done=!!h.log?.[k];html+=`<button type="button" class="v34-habit-matrix-cell ${done?'is-done':''} ${k===today?'is-today':''}" data-habit-day="${escapeHtml(String(h.id))}|${k}" title="${escapeHtml(h.name)} · ${k}">${done?'✓':'·'}</button>`}});html+='</div></div></div>';container.innerHTML=html;bindHabitMonthNavV34()
}
window.renderHabitCalendar=function(container){const layout=optsV34('habits').monthLayout||'cards';layout==='matrix'?renderHabitMonthMatrixV34(container):renderHabitMonthCardsV34(container)};
window.goToHabitToday=function(){const today=new Date();habitMonth=today.getMonth();habitYear=today.getFullYear();habitWeekStart=new Date(today);habitWeekStart.setHours(0,0,0,0);const dow=habitWeekStart.getDay();habitWeekStart.setDate(habitWeekStart.getDate()-(weekStartIndexV34()===1?(dow+6)%7:dow));renderHabits()};
const habitBtn=document.querySelector('[data-habitview="calendar"]');if(habitBtn)habitBtn.innerHTML='▦ Monthly';

function ensureCustomizerV34(){let ov=document.getElementById('view-customizer-v34');if(ov)return ov;ov=document.createElement('div');ov.id='view-customizer-v34';ov.className='modal-overlay';ov.innerHTML='<div class="modal" style="max-width:560px"><div class="modal-header"><div><h3 class="modal-title" id="v34-custom-title">Customize view</h3><div class="text-muted text-sm" id="v34-custom-subtitle"></div></div><button type="button" class="icon-btn" id="v34-custom-close" aria-label="Close">✕</button></div><div class="v34-view-options" id="v34-custom-options"></div><div class="modal-footer"><button type="button" class="btn" id="v34-custom-reset" style="margin-right:auto">Reset this view</button><button type="button" class="btn btn-primary" id="v34-custom-done">Done</button></div></div>';document.body.appendChild(ov);ov.querySelector('#v34-custom-close').onclick=()=>ov.classList.remove('active');ov.querySelector('#v34-custom-done').onclick=()=>ov.classList.remove('active');ov.onclick=e=>{if(e.target===ov)ov.classList.remove('active')};return ov}
function titleForViewV34(view){return document.querySelector(`.nav-item[data-view="${CSS.escape(view)}"]`)?.textContent.trim()||({'master-calendar':'Calendar'})[view]||view.replace(/-/g,' ').replace(/\b\w/g,x=>x.toUpperCase())}
function renderCustomOptionV34(view,desc,o){const [key,type,title,help,values]=desc;const row=document.createElement('div');row.className='v34-option-row';row.innerHTML=`<div class="v34-option-main"><div class="v34-option-title">${escapeHtml(title)}</div><div class="v34-option-desc">${escapeHtml(help||'')}</div></div><div class="v34-option-control"></div>`;const host=row.querySelector('.v34-option-control');if(type==='select'){const s=document.createElement('select');s.className='form-select';(values||[]).forEach(spec=>{const [v,l]=spec.split('|');s.add(new Option(l,v))});s.value=String(o[key]??'');s.onchange=()=>{saveOptsV34(view,{[key]:s.value});applyImmediateOptionV34(view,key,s.value)};host.appendChild(s)}else{const b=document.createElement('button');b.type='button';b.className='v34-switch '+(o[key]!==false?'on':'');b.setAttribute('role','switch');b.setAttribute('aria-checked',o[key]!==false?'true':'false');b.onclick=()=>{const next=!b.classList.contains('on');b.classList.toggle('on',next);b.setAttribute('aria-checked',String(next));saveOptsV34(view,{[key]:next})};host.appendChild(b)}return row}
function applyImmediateOptionV34(view,key,value){

  if(view==='tasks'&&key==='view'){currentTaskView=value;document.querySelectorAll('[data-taskview]').forEach(b=>b.classList.toggle('active',b.dataset.taskview===value));renderTasks()}

  if(view==='workout'&&key==='tab'){workoutTab=value;document.querySelectorAll('[data-workout-tab]').forEach(b=>b.classList.toggle('active',b.dataset.workoutTab===value));renderWorkout()}
}
window.openViewCustomizerV34=function(view=activeViewV34()){const ov=ensureCustomizerV34(),o=optsV34(view),host=ov.querySelector('#v34-custom-options');ov.querySelector('#v34-custom-title').textContent='Customize '+titleForViewV34(view);ov.querySelector('#v34-custom-subtitle').textContent='These options are saved for this page only.';host.innerHTML='';schemaV34(view).forEach(d=>host.appendChild(renderCustomOptionV34(view,d,o)));ov.querySelector('#v34-custom-reset').onclick=()=>{delete state.core.ui.pageOptions[view];try{window.omniOSUIPersistence?.persist?.()}catch(e){}applyViewOptionsV34(view);if(view==='habits')renderHabits();openViewCustomizerV34(view)};ov.classList.add('active')};

function dupTaskV34(id){const x=state.entries.find(e=>String(e.id)===String(id));if(!x)return;const y=JSON.parse(JSON.stringify(x));y.id=Date.now()+Math.random();y.title=(x.title||'Task')+' copy';y.status='todo';y.createdAt=new Date().toISOString();state.entries.push(y);saveState();window.toast?.('Task duplicated')}

function duplicatePasswordV34(id){const x=state.passwords.find(p=>String(p.id)===String(id));if(!x)return;state.passwords.push({...JSON.parse(JSON.stringify(x)),id:Date.now()+Math.random(),site:(x.site||'Login')+' copy'});saveState();window.toast?.('Password entry duplicated')}
function duplicateTemplateV34(id){const x=state.workoutTemplates.find(t=>String(t.id)===String(id));if(!x)return;state.workoutTemplates.push({...JSON.parse(JSON.stringify(x)),id:'tpl-'+Date.now()+'-'+Math.floor(Math.random()*999),name:(x.name||'Template')+' copy'});saveState();window.toast?.('Template duplicated')}
