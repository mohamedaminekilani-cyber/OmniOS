function parseSearch55(q){const parts=String(q||'').trim().split(/\s+/);const ops={},terms=[];for(const p of parts){const m=p.match(/^([a-z]+):(.*)$/i);if(m)ops[m[1].toLowerCase()]=m[2].toLowerCase();else if(p.startsWith('#'))ops.tag=p.slice(1).toLowerCase();else terms.push(p.toLowerCase())}return {ops,terms}}

const WD55=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
function parseDate55(text){let s=String(text||'').toLowerCase(),date='';const base=new Date();base.setHours(12,0,0,0);if(/\btoday\b/.test(s))date=today();else if(/\btomorrow\b/.test(s)){const d=new Date(base);d.setDate(d.getDate()+1);date=localDateString(d)}else{const m=s.match(/\bin\s+(\d+)\s+days?\b/);if(m){const d=new Date(base);d.setDate(d.getDate()+Number(m[1]));date=localDateString(d)}else{const wm=s.match(/\bnext\s+(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/);if(wm){const target=WD55.indexOf(wm[1]);const d=new Date(base);let diff=(target-d.getDay()+7)%7;if(diff===0)diff=7;d.setDate(d.getDate()+diff);date=localDateString(d)}else{const iso=s.match(/\b(20\d{2}-\d{2}-\d{2})\b/);if(iso)date=iso[1]}}}return date}
function parseTime55(text){const m=String(text||'').match(/\b(?:at\s*)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/i);if(!m)return'';let h=Number(m[1]),min=Number(m[2]||0),ap=(m[3]||'').toLowerCase();if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;if(h>23||min>59)return'';return String(h).padStart(2,'0')+':'+String(min).padStart(2,'0')}
function cleanCaptureTitle55(text){return String(text||'').replace(/^(task|todo|event|meeting|note|expense|income|habit|project|goal|journal)\s*[:\-]?\s*/i,'').replace(/\b(today|tomorrow|next\s+(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday)|in\s+\d+\s+days?|20\d{2}-\d{2}-\d{2})\b/gi,'').replace(/\b(?:at\s*)?\d{1,2}(?::\d{2})?\s*(?:am|pm)?\b/gi,'').replace(/#[\w-]+/g,'').replace(/!(high|medium|low|urgent)/gi,'').replace(/\s+/g,' ').trim()}
function parseCapture55(text){const raw=String(text||'').trim(),low=raw.toLowerCase();let type='task';if(/^event\b|^meeting\b/.test(low))type='event';else if(/^note\b/.test(low))type='note';else if(/^expense\b/.test(low))type='expense';else if(/^income\b/.test(low))type='income';else if(/^habit\b/.test(low))type='habit';else if(/^project\b/.test(low))type='project';else if(/^goal\b/.test(low))type='goal';else if(/^journal\b/.test(low))type='journal';const date=parseDate55(raw),time=parseTime55(raw),tags=[...raw.matchAll(/#([\w-]+)/g)].map(m=>m[1]);const priority=(raw.match(/!(high|medium|low)/i)||[])[1]?.toLowerCase()||'medium';const urgent=/!urgent/i.test(raw);const amount=(raw.match(/(?:expense|income)\s+\$?([0-9]+(?:\.[0-9]{1,2})?)/i)||[])[1];return{raw,type,date,time,tags,priority,urgent,amount:Number(amount||0),title:cleanCaptureTitle55(raw)||'Untitled'}}
function capturePreview55(p){return `<div class="v55-card" style="margin-top:10px"><div class="v55-card-head"><div><div class="v55-card-title">Parsed as ${esc(p.type)}</div><div class="v55-card-sub">Review before saving</div></div><span class="v55-pill">${iconForType(p.type)} ${esc(p.type)}</span></div><div class="v55-grid two"><div class="v55-stat"><div class="v55-stat-l">Title</div><div style="font-size:.78rem;font-weight:700;margin-top:5px">${esc(p.title)}</div></div><div class="v55-stat"><div class="v55-stat-l">When</div><div style="font-size:.78rem;font-weight:700;margin-top:5px">${esc([p.date,p.time].filter(Boolean).join(' ')||'Unscheduled')}</div></div></div>${p.tags.length?`<div style="margin-top:8px">${p.tags.map(t=>`<span class="v55-pill">#${esc(t)}</span>`).join(' ')}</div>`:''}</div>`}
function commitCapture55(p){const now=new Date().toISOString();let made=null;if(p.type==='task'){made={id:Date.now()+Math.random(),title:p.title,status:'todo',importance:p.priority,urgency:p.urgent?'urgent':'not-urgent',category:'work',date:p.date||'',notes:'',subtasks:[],linkedIds:[],bucket:'active',duration:60,recurrence:'none',createdAt:now};state.entries.push(made)}else if(p.type==='event'){made={id:Date.now()+Math.random(),title:p.title,date:p.date||today(),startTime:p.time||'',duration:60,reminder:15,description:'',icon:'●',recurrence:null,createdAt:now};state.calendarEvents.push(made)}else if(p.type==='note'){made={id:Date.now()+Math.random(),title:p.title,contentHtml:'',pinned:false,createdAt:now,updatedAt:now};state.notes.push(made)}else if(p.type==='expense'||p.type==='income'){made={id:Date.now()+Math.random(),type:p.type,amount:p.amount||0,categoryId:null,walletId:null,desc:p.title,date:p.date||today(),createdAt:now};state.transactions.push(made)}else if(p.type==='habit'){made={id:Date.now()+Math.random(),name:p.title,icon:'⚡',goal:'',log:{}};state.habits.push(made)}else if(p.type==='project'){made={id:uid('project'),name:p.title,status:'active',areaId:'',goalId:'',outcome:'',targetDate:p.date||'',notes:'',taskIds:[],noteIds:[],milestones:[],createdAt:now};state.life.projects.push(made)}else if(p.type==='goal'){made={id:uid('goal'),name:p.title,type:'general',targetDate:p.date||'',targetAmount:0,currentAmount:0,notes:'',createdAt:now};state.goals.push(made)}else if(p.type==='journal'){made={id:uid('journal'),date:p.date||today(),title:p.title,mood:'Okay',body:'',createdAt:now};state.life.journal.unshift(made)}if(made&&p.tags.length){const t=p.type==='expense'||p.type==='income'?'transaction':p.type;const id=made.id;getMeta(t,id).tags=[...new Set([...arr(getMeta(t,id).tags),...p.tags])]};save55();toast(`${p.type[0].toUpperCase()+p.type.slice(1)} captured`);return made}

/* ---------- smart reminders and notification center ---------- */
function daysFrom55(k){if(!k)return 9999;return Math.floor((new Date(String(k).slice(0,10)+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000)}
function derivedNotifications55(){const out=[],now=today();const add=(id,title,meta,severity='normal',open=null)=>{if(state.v55.dismissed.includes(id))return;out.push({id,title,meta,severity,open,at:new Date().toISOString()})};
 arr(state.entries).filter(t=>t.status!=='completed'&&t.date).forEach(t=>{const d=daysFrom55(t.date);if(d<0)add(`task-overdue-${t.id}`,t.title,`Task overdue by ${Math.abs(d)} day${Math.abs(d)===1?'':'s'}`,'danger',()=>{window.switchView('tasks');window.showPowerSidebarFor?.('task',t.id)});else if(d===0)add(`task-today-${t.id}`,t.title,'Task due today','warn',()=>window.switchView('tasks'))});
 arr(state.calendarEvents).forEach(e=>{const d=daysFrom55(e.date);if(d===0)add(`event-${e.id}`,e.title,`${e.startTime||'All day'} today`,'normal',()=>{window.switchView('master-calendar');window.openCalendarEventModal?.(e.id)})});
 arr(state.pantry).forEach(x=>{const d=daysFrom55(x.expires);if(x.expires&&d<=3)add(`pantry-exp-${x.id}`,x.name,d<0?'Pantry item expired':d===0?'Expires today':`Expires in ${d} days`,d<=0?'danger':'warn',()=>window.switchView('pantry'));if(Number(x.qty)<=Number(x.minQty||0))add(`pantry-low-${x.id}`,x.name,'Low pantry stock','warn',()=>window.switchView('pantry'))});
 arr(state.life?.documents).forEach(x=>{const d=daysFrom55(x.expiry);if(x.expiry&&d<=30)add(`doc-${x.id}`,x.title||'Document',d<0?'Expired':`Expires in ${d} days`,d<=7?'danger':'warn',()=>{state.settings.v35.lifeTab='documents';window.switchView('life-hub')})});
 arr(state.life?.people).forEach(x=>{const d=daysFrom55(x.nextFollowUp);if(x.nextFollowUp&&d<=2)add(`person-follow-${x.id}`,x.name||'Contact',d<0?'Follow-up overdue':d===0?'Follow up today':`Follow up in ${d} days`,'warn',()=>{state.settings.v35.lifeTab='people';window.switchView('life-hub')})});
 arr(state.life?.money).filter(x=>x.renewalDate).forEach(x=>{const d=daysFrom55(x.renewalDate);if(d<=7)add(`money-renew-${x.id}`,x.name||x.kind||'Renewal',d<0?'Past due':d===0?'Due today':`Due in ${d} days`,d<=1?'danger':'warn',()=>{state.settings.v35.lifeTab='money';window.switchView('life-hub')})});
 arr(state.v55.bills).filter(x=>!x.paid&&x.dueDate).forEach(x=>{const d=daysFrom55(x.dueDate);if(d<=7)add(`bill-${x.id}`,x.name,`${money(x.amount)} · ${d<0?'overdue':d===0?'due today':`due in ${d} days`}`,d<=0?'danger':'warn',()=>{state.v55.settings.studioTab='finance';window.switchView('studio')})});
 arr(state.v55.routines).forEach(r=>{if(!r.enabled)return;const day=new Date().getDay();if(arr(r.days).includes(day)&&!state.v55.routineLogs.some(l=>l.routineId===r.id&&l.date===now))add(`routine-${r.id}-${now}`,r.name,'Routine scheduled today','normal',()=>startRoutine55(r.id))});
 const rank={danger:0,warn:1,normal:2};return [...out,...arr(state.v55.notifications).filter(n=>!state.v55.dismissed.includes(n.id))].sort((a,b)=>(rank[a.severity||'normal']??2)-(rank[b.severity||'normal']??2))}
function addNotification55(title,meta='',severity='normal',open=null){const n={id:uid('note'),title,meta,severity,at:new Date().toISOString()};state.v55.notifications.unshift(n);state.v55.notifications=state.v55.notifications.slice(0,100);if(state.v55.settings.smartNotifications&&window.Notification&&Notification.permission==='granted'){try{new Notification(title,{body:meta})}catch(_){}}return n}
function dismissNotification55(id){if(!state.v55.dismissed.includes(id))state.v55.dismissed.push(id);state.v55.notifications=state.v55.notifications.filter(n=>n.id!==id);save55();renderNotificationBadge55();renderNotificationDrawer55()}
function snoozeNotification55(id,mins=60){state.v55.dismissed.push(id);setTimeout(()=>{state.v55.dismissed=state.v55.dismissed.filter(x=>x!==id);renderNotificationBadge55()},Math.max(1,mins)*60000);save55();renderNotificationDrawer55()}
let notifDrawer55=null,notifBack55=null;
function ensureNotificationDrawer55(){if(notifDrawer55)return;notifBack55=document.createElement('div');notifBack55.className='v55-drawer-backdrop';notifBack55.onclick=closeNotifications55;notifDrawer55=document.createElement('aside');notifDrawer55.className='v55-drawer';notifDrawer55.innerHTML='<div class="v55-drawer-head"><div><div class="v55-card-title">Notification Center</div><div class="v55-card-sub">Deadlines, renewals, low stock and routines</div></div><button class="icon-btn" id="v55-notif-close">✕</button></div><div class="v55-drawer-body" id="v55-notif-body"></div><div class="v55-drawer-foot"><button class="btn" id="v55-notif-permission">Browser notifications</button><button class="btn" id="v55-notif-clear">Dismiss all</button><button class="btn btn-primary" id="v55-notif-studio">Open Studio</button></div>';document.body.append(notifBack55,notifDrawer55);notifDrawer55.querySelector('#v55-notif-close').onclick=closeNotifications55;notifDrawer55.querySelector('#v55-notif-clear').onclick=()=>{derivedNotifications55().forEach(n=>{if(!state.v55.dismissed.includes(n.id))state.v55.dismissed.push(n.id)});state.v55.notifications=[];save55();renderNotificationDrawer55();renderNotificationBadge55()};notifDrawer55.querySelector('#v55-notif-permission').onclick=async()=>{if(!window.Notification)return alert('Browser notifications are not supported here.');const p=await Notification.requestPermission();toast(`Notifications: ${p}`)};notifDrawer55.querySelector('#v55-notif-studio').onclick=()=>{closeNotifications55();state.v55.settings.studioTab='notifications';window.switchView('studio')}}
function renderNotificationDrawer55(){ensureNotificationDrawer55();const host=notifDrawer55.querySelector('#v55-notif-body'),ns=derivedNotifications55();host.innerHTML=ns.length?`<div class="v55-list">${ns.map(n=>`<div class="v55-row clickable" data-v55-notif="${esc(n.id)}"><div class="v55-row-ico">${n.severity==='danger'?'!':n.severity==='warn'?'△':'•'}</div><div class="v55-row-main"><div class="v55-row-title">${esc(n.title)}</div><div class="v55-row-meta">${esc(n.meta||'')}</div></div><span class="v55-pill ${n.severity==='danger'?'danger':n.severity==='warn'?'warn':''}">${esc(n.severity||'normal')}</span><button class="icon-btn" data-v55-dismiss="${esc(n.id)}">✕</button></div>`).join('')}</div>`:'<div class="v55-empty">You are all caught up.</div>';host.querySelectorAll('[data-v55-notif]').forEach(row=>row.onclick=e=>{if(e.target.closest('[data-v55-dismiss]'))return;const n=ns.find(x=>x.id===row.dataset.v55Notif);n?.open?.();closeNotifications55()});host.querySelectorAll('[data-v55-dismiss]').forEach(b=>b.onclick=e=>{e.stopPropagation();dismissNotification55(b.dataset.v55Dismiss)})}
function openNotifications55(){ensureNotificationDrawer55();renderNotificationDrawer55();notifBack55.classList.add('open');notifDrawer55.classList.add('open')}
function closeNotifications55(){notifBack55?.classList.remove('open');notifDrawer55?.classList.remove('open')}
function ensureNotificationButton55(){const actions=document.querySelector('.topbar-actions');if(!actions||document.getElementById('v55-notif-btn'))return;const b=document.createElement('button');b.type='button';b.className='btn v55-topbell';b.id='v55-notif-btn';b.title='Notifications';b.setAttribute('aria-label','Notifications');b.innerHTML='🔔<span id="v55-notif-badge" class="v55-badge" style="display:none"></span>';b.onclick=openNotifications55;actions.insertBefore(b,actions.firstChild);renderNotificationBadge55()}
function renderNotificationBadge55(){const b=document.getElementById('v55-notif-badge');if(!b)return;const n=derivedNotifications55().length;b.textContent=n>99?'99+':n;b.style.display=n?'grid':'none'}
V55.notifications=openNotifications55;

/* ---------- automation engine and builder ---------- */
const TRIGGERS55={
 pantry_low:{label:'Pantry item is low',sources:()=>arr(state.pantry).filter(x=>Number(x.qty)<=Number(x.minQty||0)).map(x=>({id:x.id,title:x.name,obj:x,type:'pantry'}))},
 task_overdue:{label:'Task becomes overdue',sources:()=>arr(state.entries).filter(x=>x.status!=='completed'&&x.date&&x.date<today()).map(x=>({id:x.id,title:x.title,obj:x,type:'task'}))},
 workout_complete:{label:'Workout completed today',sources:()=>arr(state.workouts).filter(x=>x.status==='completed'&&x.date===today()).map(x=>({id:x.id,title:x.name||'Workout',obj:x,type:'workout'}))},
 document_expiring:{label:'Document expires within 30 days',sources:()=>arr(state.life?.documents).filter(x=>x.expiry&&daysFrom55(x.expiry)<=30).map(x=>({id:x.id,title:x.title,obj:x,type:'document'}))},
 bill_due:{label:'Bill due within 7 days',sources:()=>arr(state.v55.bills).filter(x=>!x.paid&&x.dueDate&&daysFrom55(x.dueDate)<=7).map(x=>({id:x.id,title:x.name,obj:x,type:'bill'}))},
 daily:{label:'Daily OmniOS check',sources:()=>[{id:today(),title:'Daily check',obj:{date:today()},type:'system'}]}
};
const ACTIONS55={notify:'Send notification',create_task:'Create a task',grocery:'Add to Grocery',mark_habit:'Mark matching habit complete',tag:'Add tag to source'};
function automationKey55(rule,src){return `${rule.id}|${src.type}:${src.id}|${today()}`}
function executeAction55(rule,src){const p=rule.params||{};if(rule.action==='notify'){addNotification55(p.title||src.title,p.message||`Automation: ${rule.name||TRIGGERS55[rule.trigger]?.label||'Rule'}`,'normal')}else if(rule.action==='create_task'){const title=(p.title||'Follow up: {title}').replace('{title}',src.title);if(!state.entries.some(t=>t.title===title&&t.date===today()&&t.status!=='completed'))state.entries.push({id:Date.now()+Math.random(),title,status:'todo',importance:p.priority||'medium',urgency:'not-urgent',category:'work',date:p.due==='today'?today():'',notes:`Created by automation: ${rule.name||''}`,subtasks:[],linkedIds:[],bucket:'active',duration:30,recurrence:'none',createdAt:new Date().toISOString()})}else if(rule.action==='grocery'){let list=arr(state.groceryLists).find(l=>l.title==='Auto restock'&&l.status!=='completed');if(!list){list={id:uid('gr'),title:'Auto restock',categoryId:null,store:'',plannedDate:'',budget:0,status:'active',notes:'Created by OmniOS automation',items:[],images:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};state.groceryLists.push(list)}if(!arr(list.items).some(i=>String(i.name).toLowerCase()===String(src.title).toLowerCase()&&!i.done))list.items.push({id:uid('gi'),name:src.title,qty:Math.max(1,Number(src.obj?.minQty||1)),unit:src.obj?.unit||'unit',estimatedCost:0,actualCost:null,done:false,pantryItemId:src.type==='pantry'?src.id:null})}else if(rule.action==='mark_habit'){const needle=String(p.habit||src.title).toLowerCase();const h=arr(state.habits).find(x=>String(x.name).toLowerCase().includes(needle)||needle.includes(String(x.name).toLowerCase()));if(h){h.log=h.log||{};h.log[today()]=true}}else if(rule.action==='tag'){const tag=(p.tag||'automated').trim();if(tag&&src.type!=='system'){const m=getMeta(src.type,src.id);m.tags=[...new Set([...arr(m.tags),tag])]}}}
let autoGuard55=false;
function runAutomations55(){ensure55();if(autoGuard55)return false;autoGuard55=true;let changed=false;try{for(const rule of state.v55.automations){if(rule.enabled===false||!TRIGGERS55[rule.trigger])continue;rule.fired=arr(rule.fired);for(const src of TRIGGERS55[rule.trigger].sources()){const key=automationKey55(rule,src);if(rule.fired.includes(key))continue;executeAction55(rule,src);rule.fired.push(key);rule.fired=rule.fired.slice(-120);rule.lastRun=new Date().toISOString();changed=true}}}finally{autoGuard55=false}return changed}
function openAutomationModal55(id=''){const r=id?state.v55.automations.find(x=>x.id===id):null;const m=modal55(r?'Edit automation':'New automation',`<div class="form-group"><label class="form-label">Name</label><input class="form-input" id="v55-auto-name" value="${esc(r?.name||'')}"></div><div class="v55-automation-flow"><div><label class="form-label">When</label><select class="form-select" id="v55-auto-trigger">${Object.entries(TRIGGERS55).map(([k,v])=>`<option value="${k}" ${r?.trigger===k?'selected':''}>${esc(v.label)}</option>`).join('')}</select></div><span class="v55-flow-arrow">→</span><div><label class="form-label">Then</label><select class="form-select" id="v55-auto-action">${Object.entries(ACTIONS55).map(([k,v])=>`<option value="${k}" ${r?.action===k?'selected':''}>${esc(v)}</option>`).join('')}</select></div><span class="v55-flow-arrow">→</span><div><label class="form-label">Enabled</label><select class="form-select" id="v55-auto-enabled"><option value="1">Yes</option><option value="0">No</option></select></div></div><div class="form-grid" style="margin-top:12px"><div class="form-group"><label>Action title / template</label><input class="form-input" id="v55-auto-title" value="${esc(r?.params?.title||'') }" placeholder="Follow up: {title}"></div><div class="form-group"><label>Message / tag / habit name</label><input class="form-input" id="v55-auto-extra" value="${esc(r?.params?.message||r?.params?.tag||r?.params?.habit||'')}"></div></div><div class="text-muted text-sm">Rules are local and idempotent per source/day. Use {title} in created-task titles.</div>`,`<button class="btn" data-v55-close>Cancel</button>${r?'<button class="btn btn-danger" id="v55-auto-delete">Delete</button>':''}<button class="btn btn-primary" id="v55-auto-save">Save rule</button>`,true);m.querySelector('#v55-auto-enabled').value=r?.enabled===false?'0':'1';m.querySelector('#v55-auto-save').onclick=()=>{const action=m.querySelector('#v55-auto-action').value,extra=m.querySelector('#v55-auto-extra').value.trim(),params={title:m.querySelector('#v55-auto-title').value.trim()};if(action==='notify')params.message=extra;if(action==='tag')params.tag=extra;if(action==='mark_habit')params.habit=extra;const data={name:m.querySelector('#v55-auto-name').value.trim()||'Automation',trigger:m.querySelector('#v55-auto-trigger').value,action,enabled:m.querySelector('#v55-auto-enabled').value==='1',params};if(r)Object.assign(r,data);else state.v55.automations.push({id:uid('auto'),...data,fired:[]});save55();m.remove();renderStudio55()};m.querySelector('#v55-auto-delete')?.addEventListener('click',()=>{if(confirm55('Delete this automation?')){state.v55.automations=state.v55.automations.filter(x=>x!==r);save55();m.remove();renderStudio55()}})}
function renderAutomations55(host){
 const rows=state.v55.automations.map(r=>{
   const trig=TRIGGERS55[r.trigger]?.label||r.trigger,act=ACTIONS55[r.action]||r.action,last=r.lastRun?' · last run '+new Date(r.lastRun).toLocaleString():'';
   return `<div class="v55-row clickable" data-auto-id="${esc(r.id)}"><div class="v55-row-ico">⚙</div><div class="v55-row-main"><div class="v55-row-title">${esc(r.name)}</div><div class="v55-row-meta">${esc(trig)} → ${esc(act)}${esc(last)}</div></div><span class="v55-pill ${r.enabled===false?'':'good'}">${r.enabled===false?'Off':'On'}</span></div>`;
 }).join('');
 host.innerHTML=`<div class="v55-card"><div class="v55-card-head"><div><div class="v55-card-title">Automation Builder</div><div class="v55-card-sub">WHEN → THEN rules connecting OmniOS modules locally.</div></div><button class="btn btn-primary" id="v55-auto-new">+ Rule</button></div>${rows?`<div class="v55-list">${rows}</div>`:'<div class="v55-empty">No custom rules yet. The existing Pantry → Grocery and Workout → Habit connections continue to work.</div>'}</div>`;
 host.querySelector('#v55-auto-new').onclick=()=>openAutomationModal55();host.querySelectorAll('[data-auto-id]').forEach(x=>x.onclick=()=>openAutomationModal55(x.dataset.autoId));
}

/* ---------- routines, morning/evening check-ins, reviews ---------- */
function openRoutineModal55(id=''){const r=id?state.v55.routines.find(x=>x.id===id):null;const steps=arr(r?.steps).map(s=>`${s.title}${s.minutes?` | ${s.minutes}`:''}`).join('\n');const m=modal55(r?'Edit routine':'New routine',`<div class="form-group"><label class="form-label">Routine name</label><input class="form-input" id="v55-r-name" value="${esc(r?.name||'')}"></div><div class="form-group"><label class="form-label">Steps — one per line, optionally “Step | minutes”</label><textarea class="form-textarea" rows="8" id="v55-r-steps">${esc(steps)}</textarea></div><div class="form-group"><label class="form-label">Days</label><div style="display:flex;gap:5px;flex-wrap:wrap">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>`<label class="v55-pill"><input type="checkbox" data-v55-r-day="${i}" ${arr(r?.days).includes(i)?'checked':''}> ${d}</label>`).join('')}</div></div><div class="form-grid"><div class="form-group"><label>Preferred time</label><input type="time" class="form-input" id="v55-r-time" value="${esc(r?.time||'08:00')}"></div><div class="form-group"><label>Status</label><select class="form-select" id="v55-r-enabled"><option value="1">Active</option><option value="0">Paused</option></select></div></div>`,`<button class="btn" data-v55-close>Cancel</button>${r?'<button class="btn btn-danger" id="v55-r-delete">Delete</button>':''}<button class="btn btn-primary" id="v55-r-save">Save routine</button>`,true);m.querySelector('#v55-r-enabled').value=r?.enabled===false?'0':'1';m.querySelector('#v55-r-save').onclick=()=>{const steps=m.querySelector('#v55-r-steps').value.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const [title,mins]=x.split('|').map(s=>s.trim());return{id:uid('step'),title,minutes:Math.max(0,Number(mins)||0)}});const data={name:m.querySelector('#v55-r-name').value.trim()||'Routine',steps,days:[...m.querySelectorAll('[data-v55-r-day]:checked')].map(x=>Number(x.dataset.v55RDay)),time:m.querySelector('#v55-r-time').value,enabled:m.querySelector('#v55-r-enabled').value==='1'};if(r)Object.assign(r,data);else state.v55.routines.push({id:uid('routine'),...data,createdAt:new Date().toISOString()});save55();m.remove();renderStudio55()};m.querySelector('#v55-r-delete')?.addEventListener('click',()=>{if(confirm55('Delete this routine?')){state.v55.routines=state.v55.routines.filter(x=>x!==r);save55();m.remove();renderStudio55()}})}
function startRoutine55(id){const r=state.v55.routines.find(x=>x.id===id);if(!r)return;let done=new Set();const m=modal55(r.name,`<div class="v55-routine-runner" id="v55-r-run">${arr(r.steps).map((s,i)=>`<div class="v55-step" data-rstep="${esc(s.id)}"><div class="v55-step-index">${i+1}</div><div class="v55-row-main"><div class="v55-row-title">${esc(s.title)}</div><div class="v55-row-meta">${s.minutes?`${s.minutes} min`:''}</div></div><button class="btn btn-sm" data-rdone="${esc(s.id)}">Done</button></div>`).join('')}</div>`,`<button class="btn" data-v55-close>Close</button><button class="btn btn-primary" id="v55-r-finish">Finish routine</button>`,true);m.querySelectorAll('[data-rdone]').forEach(b=>b.onclick=()=>{const id=b.dataset.rdone;done.has(id)?done.delete(id):done.add(id);const row=m.querySelector(`[data-rstep="${CSS.escape(id)}"]`);row?.classList.toggle('done',done.has(id));b.textContent=done.has(id)?'Undo':'Done'});m.querySelector('#v55-r-finish').onclick=()=>{state.v55.routineLogs.unshift({id:uid('rlog'),routineId:r.id,date:today(),completed:done.size,total:arr(r.steps).length,at:new Date().toISOString()});save55();m.remove();toast('Routine logged');renderStudio55()}}
function renderRoutines55(host){
 const cutoff=(()=>{const d=new Date();d.setDate(d.getDate()-6);return localDateString(d)})();
 const logs=state.v55.routineLogs.filter(x=>x.date>=cutoff);
 const routineRows=state.v55.routines.map(r=>{
   const days=arr(r.days).length?arr(r.days).map(i=>['Su','Mo','Tu','We','Th','Fr','Sa'][i]).join(' '):'Any day';
   return `<div class="v55-row"><div class="v55-row-ico">↻</div><div class="v55-row-main"><div class="v55-row-title">${esc(r.name)}</div><div class="v55-row-meta">${arr(r.steps).length} steps · ${esc(r.time||'Any time')} · ${esc(days)}</div></div><button class="btn btn-sm" data-rstart="${esc(r.id)}">Start</button><button class="icon-btn" data-redit="${esc(r.id)}">✎</button></div>`;
 }).join('');
 const logRows=logs.slice(0,12).map(l=>{
   const r=state.v55.routines.find(x=>x.id===l.routineId),pct=l.total?Math.round(l.completed/l.total*100):0;
   return `<div class="v55-row"><div class="v55-row-main"><div class="v55-row-title">${esc(r?.name||'Routine')}</div><div class="v55-row-meta">${fmtDate(l.date)} · ${l.completed}/${l.total} steps</div><div class="v55-progress" style="margin-top:6px"><i style="width:${pct}%"></i></div></div><span class="v55-pill">${pct}%</span></div>`;
 }).join('');
 host.innerHTML=`<div class="v55-grid two"><div class="v55-card"><div class="v55-card-head"><div><div class="v55-card-title">Routine Builder</div><div class="v55-card-sub">Sequential morning, evening, study or workout routines.</div></div><button class="btn btn-primary" id="v55-r-new">+ Routine</button></div>${routineRows?`<div class="v55-list">${routineRows}</div>`:'<div class="v55-empty">Build a repeatable sequence instead of recreating the same checklist every day.</div>'}</div><div class="v55-card"><div class="v55-card-title">7-day routine activity</div><div class="v55-card-sub" style="margin-bottom:10px">${logs.length} logged sessions</div>${logRows?`<div class="v55-list">${logRows}</div>`:'<div class="v55-empty">No routine activity yet.</div>'}</div></div>`;
 host.querySelector('#v55-r-new').onclick=()=>openRoutineModal55();
 host.querySelectorAll('[data-rstart]').forEach(b=>b.onclick=()=>startRoutine55(b.dataset.rstart));
 host.querySelectorAll('[data-redit]').forEach(b=>b.onclick=()=>openRoutineModal55(b.dataset.redit));
}

function checkin55(){return state.v55.checkins[today()]||(state.v55.checkins[today()]={morning:{},evening:{}})}
function openCheckin55(kind='morning'){const c=checkin55()[kind]||{},morning=kind==='morning';const m=modal55(morning?'Morning check-in':'Evening review',`<div class="form-grid"><div class="form-group"><label>Mood</label><select class="form-select" id="v55-ci-mood">${['Great','Good','Okay','Low','Difficult'].map(x=>`<option ${c.mood===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label>Energy 1–10</label><input type="number" min="1" max="10" class="form-input" id="v55-ci-energy" value="${esc(c.energy||'')}"></div>${morning?`<div class="form-group"><label>Sleep hours</label><input type="number" min="0" max="24" step=".25" class="form-input" id="v55-ci-sleep" value="${esc(c.sleep||'')}"></div><div class="form-group"><label>Sleep quality 1–10</label><input type="number" min="1" max="10" class="form-input" id="v55-ci-sleepq" value="${esc(c.sleepQuality||'')}"></div>`:''}</div><div class="form-group"><label>${morning?'Top priorities (one per line)':'Wins / progress'}</label><textarea class="form-textarea" id="v55-ci-main" rows="4">${esc(c.main||'')}</textarea></div><div class="form-group"><label>${morning?'Intention / constraint':'What to improve tomorrow'}</label><textarea class="form-textarea" id="v55-ci-note" rows="3">${esc(c.note||'')}</textarea></div>`,`<button class="btn" data-v55-close>Cancel</button><button class="btn btn-primary" id="v55-ci-save">Save check-in</button>`);m.querySelector('#v55-ci-save').onclick=()=>{const data={mood:m.querySelector('#v55-ci-mood').value,energy:Number(m.querySelector('#v55-ci-energy').value)||'',main:m.querySelector('#v55-ci-main').value.trim(),note:m.querySelector('#v55-ci-note').value.trim(),at:new Date().toISOString()};if(morning){data.sleep=Number(m.querySelector('#v55-ci-sleep').value)||'';data.sleepQuality=Number(m.querySelector('#v55-ci-sleepq').value)||''}checkin55()[kind]=data;if(morning&&data.sleep){state.life.health.unshift({id:uid('health'),date:today(),sleep:data.sleep,mood:data.mood,energy:data.energy,water:'',weight:'',notes:'Morning check-in',createdAt:new Date().toISOString()})}save55();m.remove();enhanceToday55()}}
function enhanceToday55(){const view=document.getElementById('view-today');if(!view||!view.classList.contains('active'))return;view.querySelector('#v55-today-checkins')?.remove();const c=checkin55(),wrap=document.createElement('div');wrap.id='v55-today-checkins';wrap.innerHTML=`<div class="v55-checkin"><div class="v55-stat" id="v55-morning"><div class="v55-stat-l">Morning</div><div class="v55-stat-v">${c.morning?.at?'✓':'○'}</div><div class="v55-row-meta">${c.morning?.energy?`Energy ${c.morning.energy}/10`:c.morning?.at?'Logged':'Check in'}</div></div><div class="v55-stat" id="v55-evening"><div class="v55-stat-l">Evening</div><div class="v55-stat-v">${c.evening?.at?'✓':'○'}</div><div class="v55-row-meta">${c.evening?.mood||'Review your day'}</div></div><div class="v55-stat"><div class="v55-stat-l">Sleep</div><div class="v55-stat-v">${c.morning?.sleep?c.morning.sleep+'h':'—'}</div><div class="v55-row-meta">${c.morning?.sleepQuality?'Quality '+c.morning.sleepQuality+'/10':'Morning log'}</div></div><div class="v55-stat"><div class="v55-stat-l">Notifications</div><div class="v55-stat-v">${derivedNotifications55().length}</div><div class="v55-row-meta">Need attention</div></div><div class="v55-stat" id="v55-today-capture-card"><div class="v55-stat-l">Quick capture</div><div class="v55-stat-v">＋</div><div class="v55-row-meta">Natural language</div></div></div>`;const root=view.querySelector('[id^="v35-today-root"]')||view.firstElementChild||view;root.prepend(wrap);wrap.querySelector('#v55-morning').onclick=()=>openCheckin55('morning');wrap.querySelector('#v55-evening').onclick=()=>openCheckin55('evening');wrap.querySelector('#v55-today-capture-card').onclick=()=>openCapture55()}

function metrics55(days=7){const end=new Date(),start=new Date();start.setDate(end.getDate()-days+1);const a=localDateString(start),b=localDateString(end);const tasks=arr(state.entries).filter(x=>(x.createdAt||x.date||'').slice(0,10)>=a),done=arr(state.entries).filter(x=>x.status==='completed'&&((x.completedAt||x.date||x.createdAt||'').slice(0,10)>=a));const focus=Object.entries(state.focusDaily||{}).filter(([d])=>d>=a&&d<=b).reduce((s,[,m])=>s+Number(m||0),0);const spend=arr(state.transactions).filter(x=>x.type==='expense'&&x.status!=='pending'&&!x.isTransfer&&x.date>=a&&x.date<=b).reduce((s,x)=>s+Number(x.amount||0),0);const habitDays=arr(state.habits).reduce((s,h)=>s+Object.entries(h.log||{}).filter(([d,v])=>v&&d>=a&&d<=b).length,0);const workouts=arr(state.workouts).filter(x=>x.status==='completed'&&x.date>=a&&x.date<=b).length;return{a,b,tasks:tasks.length,done:done.length,focus,spend,habitDays,workouts}}
function generateReviewText55(period='weekly'){const d=period==='monthly'?30:period==='yearly'?365:7,m=metrics55(d);const lines=[`${period[0].toUpperCase()+period.slice(1)} review (${fmtDate(m.a)} – ${fmtDate(m.b)})`,`Completed tasks: ${m.done}`,`Focus: ${m.focus} min`,`Habit completions: ${m.habitDays}`,`Workouts: ${m.workouts}`,`Spending: ${money(m.spend)}`];const overdue=arr(state.entries).filter(x=>x.status!=='completed'&&x.date&&x.date<today()).length;if(overdue)lines.push(`Open risk: ${overdue} overdue task${overdue===1?'':'s'}.`);const docs=arr(state.life?.documents).filter(x=>x.expiry&&daysFrom55(x.expiry)<=30).length;if(docs)lines.push(`Administration: ${docs} document renewal${docs===1?'':'s'} within 30 days.`);return lines.join('\n')}
function openReviewModal55(period='weekly'){const existing=state.v55.reviews.find(x=>x.period===period&&x.key===(period==='yearly'?String(new Date().getFullYear()):today()));const m=modal55(`${period[0].toUpperCase()+period.slice(1)} Review`,`<div class="form-group"><label class="form-label">Generated recap</label><textarea class="form-textarea" id="v55-review-generated" rows="8">${esc(generateReviewText55(period))}</textarea></div><div class="form-group"><label class="form-label">Reflection / decisions</label><textarea class="form-textarea" id="v55-review-notes" rows="7">${esc(existing?.notes||'')}</textarea></div>`,`<button class="btn" data-v55-close>Cancel</button><button class="btn btn-primary" id="v55-review-save">Save review</button>`,true);m.querySelector('#v55-review-save').onclick=()=>{const key=period==='yearly'?String(new Date().getFullYear()):today(),data={id:existing?.id||uid('review'),period,key,generated:m.querySelector('#v55-review-generated').value,notes:m.querySelector('#v55-review-notes').value,at:new Date().toISOString()};if(existing)Object.assign(existing,data);else state.v55.reviews.unshift(data);save55();m.remove();renderStudio55()}}
function renderReviews55(host){const m7=metrics55(7),m30=metrics55(30);host.innerHTML=`<div class="v55-grid four"><div class="v55-stat"><div class="v55-stat-l">Tasks completed · 7d</div><div class="v55-stat-v">${m7.done}</div></div><div class="v55-stat"><div class="v55-stat-l">Focus · 7d</div><div class="v55-stat-v">${Math.round(m7.focus/60*10)/10}h</div></div><div class="v55-stat"><div class="v55-stat-l">Habits · 7d</div><div class="v55-stat-v">${m7.habitDays}</div></div><div class="v55-stat"><div class="v55-stat-l">Spend · 30d</div><div class="v55-stat-v">${money(m30.spend)}</div></div></div><div class="v55-grid two" style="margin-top:12px"><div class="v55-card"><div class="v55-card-head"><div><div class="v55-card-title">Structured reviews</div><div class="v55-card-sub">Turn activity into decisions instead of just statistics.</div></div></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn" data-review="weekly">Weekly review</button><button class="btn" data-review="monthly">Monthly review</button><button class="btn" data-review="yearly">Year review</button></div></div><div class="v55-card"><div class="v55-card-title">Review history</div><div style="margin-top:9px" class="v55-list">${state.v55.reviews.slice(0,8).map(r=>`<div class="v55-row"><div class="v55-row-ico">↺</div><div class="v55-row-main"><div class="v55-row-title">${esc(r.period)} review</div><div class="v55-row-meta">${new Date(r.at).toLocaleString()}</div></div></div>`).join('')||'<div class="v55-empty">No saved reviews yet.</div>'}</div></div></div>`;host.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>openReviewModal55(b.dataset.review))}

/* ---------- Study workspace, grade calculator ---------- */
function courseBy55(id){return state.v55.study.courses.find(x=>x.id===id)}
function assessments55(courseId){return state.v55.study.assessments.filter(x=>x.courseId===courseId)}
function gradeStats55(courseId){const a=assessments55(courseId);let earned=0,weightDone=0;for(const x of a){if(x.score===''||x.score==null)continue;const w=Number(x.weight)||0;earned+=Number(x.score||0)*w/100;weightDone+=w}const current=weightDone?earned/weightDone*100:0;return{earned,weightDone,current,remaining:Math.max(0,100-weightDone)}}
function neededGrade55(courseId,target){const s=gradeStats55(courseId);return s.remaining?Math.max(0,(Number(target||0)-s.earned)/(s.remaining/100)):0}
function openCourseModal55(id=''){const c=id?courseBy55(id):null;const m=modal55(c?'Edit course':'New course',`<div class="form-grid"><div class="form-group"><label>Course</label><input class="form-input" id="v55-course-name" value="${esc(c?.name||'')}"></div><div class="form-group"><label>Term</label><input class="form-input" id="v55-course-term" value="${esc(c?.term||'')}"></div><div class="form-group"><label>Target grade %</label><input type="number" min="0" max="100" class="form-input" id="v55-course-target" value="${esc(c?.target||80)}"></div><div class="form-group"><label>Credits</label><input type="number" min="0" step=".5" class="form-input" id="v55-course-credits" value="${esc(c?.credits||3)}"></div></div><div class="form-group"><label>Notes</label><textarea class="form-textarea" id="v55-course-notes">${esc(c?.notes||'')}</textarea></div>`,`<button class="btn" data-v55-close>Cancel</button>${c?'<button class="btn btn-danger" id="v55-course-delete">Delete</button>':''}<button class="btn btn-primary" id="v55-course-save">Save</button>`);m.querySelector('#v55-course-save').onclick=()=>{const data={name:m.querySelector('#v55-course-name').value.trim()||'Course',term:m.querySelector('#v55-course-term').value.trim(),target:Number(m.querySelector('#v55-course-target').value)||0,credits:Number(m.querySelector('#v55-course-credits').value)||0,notes:m.querySelector('#v55-course-notes').value.trim()};if(c)Object.assign(c,data);else state.v55.study.courses.push({id:uid('course'),...data,createdAt:new Date().toISOString()});save55();m.remove();renderStudio55()};m.querySelector('#v55-course-delete')?.addEventListener('click',()=>{if(confirm55('Delete this course and its assessments?')){state.v55.study.assessments=state.v55.study.assessments.filter(x=>x.courseId!==c.id);state.v55.study.courses=state.v55.study.courses.filter(x=>x!==c);save55();m.remove();renderStudio55()}})}

function renderStudy55(host){const courses=state.v55.study.courses;const learning=arr(state.life?.learning).filter(x=>['Book','Article','Course','Certification'].includes(x.type));host.innerHTML=`<div class="v55-grid two"><div class="v55-card"><div class="v55-card-head"><div><div class="v55-card-title">Courses & grades</div><div class="v55-card-sub">Weighted assessment tracker with target-grade calculation.</div></div><button class="btn btn-primary" id="v55-course-new">+ Course</button></div>${courses.length?courses.map(c=>{const s=gradeStats55(c.id),need=neededGrade55(c.id,c.target);return`<div class="v55-card" style="padding:12px;margin-top:9px;background:var(--bg-base)"><div class="v55-card-head"><div><div class="v55-card-title">${esc(c.name)}</div><div class="v55-card-sub">${esc(c.term||'')} · target ${c.target||0}%</div></div><div style="display:flex;gap:5px"><button class="btn btn-sm" data-v55-add-ass="${esc(c.id)}">+ Assessment</button><button class="icon-btn" data-v55-edit-course="${esc(c.id)}">✎</button></div></div><div class="v55-grid four"><div class="v55-stat"><div class="v55-stat-l">Current</div><div class="v55-stat-v ${s.current>=Number(c.target||0)?'v55-grade-good':'v55-grade-warn'}">${s.weightDone?Math.round(s.current*10)/10+'%':'—'}</div></div><div class="v55-stat"><div class="v55-stat-l">Weight graded</div><div class="v55-stat-v">${Math.round(s.weightDone*10)/10}%</div></div><div class="v55-stat"><div class="v55-stat-l">Earned pts</div><div class="v55-stat-v">${Math.round(s.earned*10)/10}</div></div><div class="v55-stat"><div class="v55-stat-l">Need on remainder</div><div class="v55-stat-v">${s.remaining?Math.round(need*10)/10+'%':'—'}</div></div></div>${assessments55(c.id).length?`<table class="v55-table" style="margin-top:8px"><thead><tr><th>Assessment</th><th>Weight</th><th>Score</th><th>Due</th></tr></thead><tbody>${assessments55(c.id).map(a=>`<tr data-v55-ass="${esc(a.id)}" data-course="${esc(c.id)}" style="cursor:pointer"><td>${esc(a.name)}</ function netWorth55(){const a=arr(state.life?.money).filter(x=>['Account','Asset'].includes(x.kind)).reduce((s,x)=>s+Number(x.amount||0),0),d=arr(state.life?.money).filter(x=>x.kind==='Debt').reduce((s,x)=>s+Number(x.amount||0),0);return{assets:a,debt:d,net:a-d}}

/* ---------- Privacy lock + encrypted local vault ---------- */
let vaultKey55=null,privacyLocked55=false;
const te55=new TextEncoder(),td55=new TextDecoder();
async function sha55(text){const b=await crypto.subtle.digest('SHA-256',te55.encode(String(text)));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function b64u55(bytes){let s='';for(const b of bytes)s+=String.fromCharCode(b);return btoa(s)}
function unb64u55(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function deriveVaultKey55(pass,salt){const km=await crypto.subtle.importKey('raw',te55.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptVault55(obj,pass){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveVaultKey55(pass,salt),cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te55.encode(JSON.stringify(obj)));return{salt:b64u55(salt),iv:b64u55(iv),cipher:b64u55(new Uint8Array(cipher))}}
async function decryptVault55(enc,pass){const key=await deriveVaultKey55(pass,unb64u55(enc.salt)),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64u55(enc.iv)},key,unb64u55(enc.cipher));return JSON.parse(td55.decode(plain))}
async function setPin55(pin){state.v55.privacy.pinHash=pin?await sha55(pin):'';state.v55.privacy.enabled=!!pin;save55()}
function ensureLockscreen55(){let el=document.getElementById('v55-lockscreen');if(el)return el;el=document.createElement('div');el.id='v55-lockscreen';el.className='v55-lockscreen';el.innerHTML=`<div class="v55-lockbox"><div class="v55-lock-logo">🔐</div><h2>${esc(state.settings?.branding?.title||'OmniOS')}</h2><div class="text-muted text-sm">This local workspace is locked.</div><input type="password" inputmode="numeric" class="form-input" id="v55-unlock-pin" placeholder="PIN"><button class="btn btn-primary" id="v55-unlock-btn" style="width:100%;justify-content:center">Unlock</button><div id="v55-unlock-msg" class="text-muted text-sm" style="margin-top:8px"></div></div>`;document.body.appendChild(el);el.querySelector('#v55-unlock-btn').onclick=async()=>{const pin=el.querySelector('#v55-unlock-pin').value;if(await sha55(pin)===state.v55.privacy.pinHash){privacyLocked55=false;el.classList.remove('open');el.querySelector('#v55-unlock-pin').value='';el.querySelector('#v55-unlock-msg').textContent=''}else el.querySelector('#v55-unlock-msg').textContent='Incorrect PIN'};el.querySelector('#v55-unlock-pin').onkeydown=e=>{if(e.key==='Enter')el.querySelector('#v55-unlock-btn').click()};return el}

async function openSetPin55(){const m=modal55('Privacy PIN',`<div class="form-group"><label>New PIN</label><input type="password" inputmode="numeric" class="form-input" id="v55-pin-1"></div><div class="form-group"><label>Confirm PIN</label><input type="password" inputmode="numeric" class="form-input" id="v55-pin-2"></div><div class="text-muted text-sm">The hash is stored locally. This is an app privacy gate, not a substitute for full device encryption.</div>`,`<button class="btn" data-v55-close>Cancel</button>${state.v55.privacy.enabled?'<button class="btn btn-danger" id="v55-pin-clear">Disable lock</button>':''}<button class="btn btn-primary" id="v55-pin-save">Save PIN</button>`);m.querySelector('#v55-pin-save').onclick=async()=>{const a=m.querySelector('#v55-pin-1').value,b=m.querySelector('#v55-pin-2').value;if(a.length<4)return alert('Use at least 4 characters.');if(a!==b)return alert('PINs do not match.');await setPin55(a);m.remove();toast('Privacy lock enabled');renderStudio55()};m.querySelector('#v55-pin-clear')?.addEventListener('click',async()=>{if(confirm55('Disable the app lock?')){await setPin55('');privacyLocked55=false;m.remove();renderStudio55()}})}
async function unlockVault55(){const m=modal55('Unlock encrypted vault',`<div class="form-group"><label>Vault passphrase</label><input type="password" class="form-input" id="v55-vpass"></div><div class="text-muted text-sm">The passphrase is never stored. If it is lost, encrypted vault entries cannot be recovered.</div>`,`<button class="btn" data-v55-close>Cancel</button><button class="btn btn-primary" id="v55-vunlock">Unlock</button>`);m.querySelector('#v55-vunlock').onclick=async()=>{const pass=m.querySelector('#v55-vpass').value;if(!pass)return;try{if(state.v55.privacy.vaultCheck){const d=await decryptVault55(state.v55.privacy.vaultCheck,pass);if(d?.check!=='omnios-vault')throw new Error('bad')}else{state.v55.privacy.vaultCheck=await encryptVault55({check:'omnios-vault'},pass);save55()}vaultKey55=pass;m.remove();toast('Vault unlocked');renderStudio55()}catch(e){alert('Could not unlock vault. Check the passphrase.')}}}
async function openVaultItem55(id=''){if(!vaultKey55)return unlockVault55();const rec=id?state.v55.vault.find(x=>x.id===id):null;let data={title:'',body:''};if(rec){try{data=await decryptVault55(rec.enc,vaultKey55)}catch(e){vaultKey55=null;return unlockVault55()}}const m=modal55(rec?'Edit vault item':'New vault item',`<div class="form-group"><label>Title</label><input class="form-input" id="v55-v-title" value="${esc(data.title||'')}"></div><div class="form-group"><label>Private content</label><textarea class="form-textarea" rows="10" id="v55-v-body">${esc(data.body||'')}</textarea></div>`,`<button class="btn" data-v55-close>Cancel</button>${rec?'<button class="btn btn-danger" id="v55-v-delete">Delete</button>':''}<button class="btn btn-primary" id="v55-v-save">Encrypt & save</button>`,true);m.querySelector('#v55-v-save').onclick=async()=>{const obj={title:m.querySelector('#v55-v-title').value.trim()||'Private item',body:m.querySelector('#v55-v-body').value};const enc=await encryptVault55(obj,vaultKey55);if(rec){rec.enc=enc;rec.updatedAt=new Date().toISOString()}else state.v55.vault.unshift({id:uid('vault'),enc,createdAt:new Date().toISOString()});save55();m.remove();renderStudio55()};m.querySelector('#v55-v-delete')?.addEventListener('click',()=>{if(confirm55('Delete this encrypted item?')){state.v55.vault=state.v55.vault.filter(x=>x!==rec);save55();m.remove();renderStudio55()}})}
async function renderVaultList55(container){if(!vaultKey55){container.innerHTML='<div class="v55-vault-lock"><div style="font-size:2rem">🔐</div><div class="v55-card-title" style="margin:8px">Encrypted Vault</div><div class="v55-card-sub">AES-GCM encrypted private notes. The passphrase stays only in memory.</div><button class="btn btn-primary" id="v55-vault-unlock" style="margin-top:12px">Unlock vault</button></div>';container.querySelector('#v55-vault-unlock').onclick=unlockVault55;return}const decoded=[];for(const r of state.v55.vault){try{decoded.push({rec:r,data:await decryptVault55(r.enc,vaultKey55)})}catch(_){}}container.innerHTML=`<div class="v55-card-head"><div><div class="v55-card-title">Encrypted Vault</div><div class="v55-card-sub">${decoded.length} private item${decoded.length===1?'':'s'}</div></div><div style="display:flex;gap:6px"><button class="btn" id="v55-vault-lock">Lock vault</button><button class="btn btn-primary" id="v55-vault-new">+ Private item</button></div></div><div class="v55-list">${decoded.map(({rec,data})=>`<div class="v55-row clickable" data-vault="${esc(rec.id)}"><div class="v55-row-ico">🔒</div><div class="v55-row-main"><div class="v55-row-title">${esc(data.title)}</div><div class="v55-row-meta">Encrypted locally · ${rec.updatedAt?new Date(rec.updatedAt).toLocaleString():new Date(rec.createdAt).toLocaleString()}</div></div></div>`).join('')||'<div class="v55-empty">Vault unlocked. Add your first encrypted item.</div>'}</div>`;container.querySelector('#v55-vault-new').onclick=()=>openVaultItem55();container.querySelector('#v55-vault-lock').onclick=()=>{vaultKey55=null;renderStudio55()};container.querySelectorAll('[data-vault]').forEach(x=>x.onclick=()=>openVaultItem55(x.dataset.vault))}
function renderPrivacy55(host){host.innerHTML=`<div class="v55-grid two"><div class="v55-card"><div class="v55-card-head"><div><div class="v55-card-title">App privacy lock</div><div class="v55-card-sub">Protect the entire local workspace with a PIN when you leave it open.</div></div><span class="v55-pill ${state.v55.privacy.enabled?'good':''}">${state.v55.privacy.enabled?'Enabled':'Off'}</span></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn" id="v55-set-pin">${state.v55.privacy.enabled?'Change PIN':'Set PIN'}</button><button class="btn btn-primary" id="v55-lock-now" ${state.v55.privacy.enabled?'':'disabled'}>Lock now</button></div><div class="v55-card-sub" style="margin-top:10px">Sensitive-object flags can be set from object Metadata. Passwords and vault data should still be protected by your device account.</div></div><div class="v55-card" id="v55-vault-host"></div></div>`;host.querySelector('#v55-set-pin').onclick=openSetPin55;host.querySelector('#v55-lock-now').onclick=lockApp55;renderVaultList55(host.querySelector('#v55-vault-host'))}

function shortcutMatch55(e,spec){const s=String(spec||'').toLowerCase().split('+').map(x=>x.trim()).filter(Boolean),key=s.pop();const map={ctrl:e.ctrlKey,control:e.ctrlKey,cmd:e.metaKey,meta:e.metaKey,alt:e.altKey,shift:e.shiftKey};if(s.some(x=>!map[x]))return false;const required={ctrl:s.includes('ctrl')||s.includes('control'),meta:s.includes('cmd')||s.includes('meta'),alt:s.includes('alt'),shift:s.includes('shift')};if(e.ctrlKey&&!required.ctrl||e.metaKey&&!required.meta||e.altKey&&!required.alt||e.shiftKey&&!required.shift)return false;let ek=e.key.toLowerCase();if(ek===' ')ek='space';return ek===String(key).toLowerCase()}

function calendarConflicts55(){const items=[];arr(state.calendarEvents).forEach(e=>{if(e.date&&e.startTime)items.push({id:`event:${e.id}`,date:e.date,start:e.startTime,dur:Number(e.duration)||60,title:e.title||'Event'})});arr(state.life?.timeBlocks).forEach(e=>{if(e.date&&e.startTime)items.push({id:`block:${e.id}`,date:e.date,start:e.startTime,dur:Number(e.duration)||60,title:e.title||'Time block'})});const min=t=>{const[h,m]=String(t).split(':').map(Number);return(h||0)*60+(m||0)},out=[];for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const a=items[i],b=items[j];if(a.date!==b.date)continue;const as=min(a.start),ae=as+a.dur,bs=min(b.start),be=bs+b.dur;if(as<be&&bs<ae)out.push({date:a.date,a,b})}return out.slice(0,20)}
function habitCorrelations55(){const focus=state.focusDaily||{},health=arr(state.life?.health);return arr(state.habits).map(h=>{const done=Object.entries(h.log||{}).filter(([,v])=>v).map(([d])=>d),notDone=[];Object.keys(focus).forEach(d=>{if(!done.includes(d))notDone.push(d)});const avg=a=>a.length?a.reduce((s,d)=>s+Number(focus[d]||0),0)/a.length:0,fd=avg(done),fn=avg(notDone);const energyDone=health.filter(x=>done.includes(x.date)&&x.energy).map(x=>Number(x.energy)),energyOther=health.filter(x=>!done.includes(x.date)&&x.energy).map(x=>Number(x.energy));const av=n=>n.length?n.reduce((s,x)=>s+x,0)/n.length:0;return{id:h.id,name:h.name,focusDiff:Math.round((fd-fn)*10)/10,energyDiff:Math.round((av(energyDone)-av(energyOther))*10)/10,samples:done.length}}).filter(x=>x.samples>=2).sort((a,b)=>Math.abs(b.focusDiff)-Math.abs(a.focusDiff))}
function aiAnswer55(q){const s=String(q||'').toLowerCase();if(/today|focus on|priority/.test(s)){const t=arr(state.entries).filter(x=>x.status!=='completed'&&(x.date===today()||x.date<today())).sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(0,5),ev=arr(state.calendarEvents).filter(x=>x.date===today()).slice(0,5);return`Today has ${t.length} surfaced task${t.length===1?'':'s'} and ${ev.length} event${ev.length===1?'':'s'}.\n${t.map(x=>'• '+x.title).join('\n')}${ev.length?'\nCalendar:\n'+ev.map(x=>`• ${x.startTime||'All day'} ${x.title}`).join('\n'):''}`.trim()}if(/spend|money|budget|overspend/.test(s)){const start=new Date();start.setDate(start.getDate()-30);const a=localDateString(start),tx=arr(state.transactions).filter(x=>x.type==='expense'&&x.status!=='pending'&&!x.isTransfer&&x.date>=a),total=tx.reduce((z,x)=>z+Number(x.amount||0),0),cats={};tx.forEach(x=>{const c=arr(state.budgetCategories).find(c=>String(c.id)===String(x.categoryId))?.name||'Other';cats[c]=(cats[c]||0)+Number(x.amount||0)});const top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,4);return`Last 30 days spending: ${money(total)}.\n${top.map(([k,v])=>`• ${k}: ${money(v)}`).join('\n')||'No expense data.'}`}if(/grocery|pantry|food|expire/.test(s)){const low=arr(state.pantry).filter(x=>Number(x.qty)<=Number(x.minQty||0)),exp=arr(state.pantry).filter(x=>x.expires&&daysFrom55(x.expires)<=5);return`Pantry check: ${low.length} low-stock item${low.length===1?'':'s'}, ${exp.length} expiring/expired soon.\n${[...low,...exp].slice(0,8).map(x=>`• ${x.name}${x.expires?' · '+fmtDate(x.expires):''}`).join('\n')||'Nothing urgent.'}`}if(/block|research|thesis|paper/.test(s)){const b=researchBlockers55();return b.length?`Potential research blockers:\n${b.map(x=>'• '+x).join('\n')}`:'No obvious research blockers detected from current deadlines.'}if(/week|review|summary/.test(s))return generateReviewText55('weekly');if(/sleep|energy|mood/.test(s)){const h=arr(state.life?.health).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,14),avg=k=>{const a=h.map(x=>Number(x[k])).filter(Boolean);return a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length*10)/10:'—'};return`Recent health signals: average sleep ${avg('sleep')}h, average energy ${avg('energy')}/10 across ${h.length} recent health logs.`}return`I can analyze the local OmniOS data for: today's priorities, spending/budget, pantry/groceries, research blockers, weekly review, sleep/energy, upcoming renewals, and calendar conflicts. No data is sent outside this file.`}

async function openBarcode55(){const m=modal55('Barcode capture',`<div class="v55-card-sub">If this browser supports BarcodeDetector and camera access, OmniOS can read a code locally. It does not have a built-in online product database, so you can name the item after scanning.</div><video id="v55-bar-video" playsinline style="width:100%;max-height:320px;background:#000;border-radius:10px;margin-top:10px"></video><div class="form-grid" style="margin-top:10px"><div class="form-group"><label>Barcode</label><input class="form-input" id="v55-bar-code"></div><div class="form-group"><label>Item name</label><input class="form-input" id="v55-bar-name"></div></div>`,`<button class="btn" data-v55-close>Close</button><button class="btn" id="v55-bar-start">Start camera</button><button class="btn btn-primary" id="v55-bar-pantry">Add to Pantry</button>`);let stream=null,timer=null;const stop=()=>{if(timer)clearInterval(timer);stream?.getTracks?.().forEach(t=>t.stop())};m.addEventListener('remove',stop);m.querySelector('[data-v55-close]').addEventListener('click',stop);m.querySelector('#v55-bar-start').onclick=async()=>{if(!navigator.mediaDevices?.getUserMedia)return alert('Camera access is not available here. Enter the barcode manually.');if(!window.BarcodeDetector)return alert('BarcodeDetector is not supported by this browser. Enter the barcode manually.');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=m.querySelector('#v55-bar-video');v.srcObject=stream;await v.play();const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','qr_code']});timer=setInterval(async()=>{try{const codes=await det.detect(v);if(codes[0]){m.querySelector('#v55-bar-code').value=codes[0].rawValue;stop();toast('Barcode captured')}}catch(_){}},700)}catch(e){alert('Could not start camera: '+e.message)}};m.querySelector('#v55-bar-pantry').onclick=()=>{const code=m.querySelector('#v55-bar-code').value.trim(),name=m.querySelector('#v55-b  setInterval(()=>{try{renderNotificationBadge55();if(document.visibilityState==='visible'&&state.v55.settings.smartNotifications){const severe=derivedNotifications55().filter(n=>n.severity==='danger');const key='v55_notice_'+today();if(severe.length&&storage.getItem(key)!=='1'&&window.Notification?.permission==='granted'){new Notification('OmniOS needs attention',{body:`${severe.length} urgent item${severe.length===1?'':'s'} need review.`});storage.setItem(key,'1')}}}catch(_){}},60000);

<script id="omnios-v56-audit-js">
(function(){
'use strict';
if(window.OmniV56)return;
const V56=window.OmniV56={version:'56.0-audit'};
const arr=x=>Array.isArray(x)?x:[];
const num=(v,d=0)=>Number.isFinite(Number(v))?Number(v):d;
const nonneg=(v,d=0)=>Math.max(0,num(v,d));
const today=()=>window.localDateString?localDateString():new Date().toISOString().slice(0,10);
const money=v=>window.currencyLocal?currencyLocal(num(v)):num(v).toFixed(2);
const esc=v=>window.escapeHtml?escapeHtml(v??''):String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function ensure56(){
 state.v56=state.v56&&typeof state.v56==='object'?state.v56:{};
 state.v56.daily=state.v56.daily&&typeof state.v56.daily==='object'?state.v56.daily:{};
 state.v56.settings={waterGoal:8,...(state.v56.settings||{})};
 const d=state.v56.daily[today()]||(state.v56.daily[today()]={water:0,note:'',updatedAt:new Date().toISOString()});
 d.water=nonneg(d.water); d.note=String(d.note||'');
}
function normalize56(){
 ensure56();
 state.transactions=arr(state.transactions).map(t=>({...t,amount:nonneg(t.amount),type:t.type==='income'?'income':'expense',status:t.status==='pending'?'pending':'cleared',date:String(t.date||today()).slice(0,10),tags:arr(t.tags),isTransfer:!!t.isTransfer}));
 state.budgetCategories=arr(state.budgetCategories).map(c=>({...c,limit:nonneg(c.limit),type:c.type==='income'?'income':'expense'}));
 state.wallets=arr(state.wallets).map(w=>({...w,openingBalance:num(w.openingBalance),creditLimit:nonneg(w.creditLimit),includeInNetWorth:w.includeInNetWorth!==false}));
 state.groceryLists=arr(state.groceryLists).map(l=>({...l,budget:nonneg(l.budget),items:arr(l.items).map(i=>({...i,qty:nonneg(i.qty,1),estimatedCost:nonneg(i.estimatedCost),actualCost:i.actualCost==null?null:nonneg(i.actualCost),done:!!i.done}))}));
 state.pantry=arr(state.pantry).map(p=>({...p,qty:nonneg(p.qty),minQty:nonneg(p.minQty),cost:nonneg(p.cost)}));
 state.focusDaily=state.focusDaily&&typeof state.focusDaily==='object'?state.focusDaily:{};
 Object.keys(state.focusDaily).forEach(k=>state.focusDaily[k]=nonneg(state.focusDaily[k]));
 arr(state.workouts).forEach(w=>arr(w.exercises).forEach(e=>arr(e.sets).forEach(st=>{if('weight' in st)st.weight=nonneg(st.weight);if('reps' in st)st.reps=nonneg(st.reps);if('duration' in st)st.duration=nonneg(st.duration)})));
 return state;
}
function txValid56(t){return t&&['income','expense'].includes(t.type)&&Number.isFinite(Number(t.amount))&&Number(t.amount)>=0&&/^\\d{4}-\\d{2}-\\d{2}$/.test(String(t.date||''))}
function health56(){
 const issues=[];
 const dup=(xs,label)=>{const seen=new Set(),ds=[];for(const x of xs){const k=String(x?.id??'');if(k&&seen.has(k))ds.push(k);seen.add(k)}if(ds.length)issues.push({tone:'bad',text:`${label}: ${ds.length} duplicate ID${ds.length===1?'':'s'}.`})};
 dup(arr(state.transactions),'Transactions');dup(arr(state.entries),'Tasks');dup(arr(state.groceryLists),'Grocery lists');dup(arr(state.pantry),'Pantry');
 const badTx=arr(state.transactions).filter(t=>!txValid56(t));if(badTx.length)issues.push({tone:'bad',text:`${badTx.length} transaction${badTx.length===1?'':'s'} contain invalid amount/type/date data.`});
 const orphanWallet=arr(state.transactions).filter(t=>t.walletId&&!arr(state.wallets).some(w=>String(w.id)===String(t.walletId)));if(orphanWallet.length)issues.push({tone:'warn',text:`${orphanWallet.length} transaction${orphanWallet.length===1?'':'s'} reference a deleted account.`});
 const orphanCat=arr(state.transactions).filter(t=>t.categoryId&&!arr(state.budgetCategories).some(c=>String(c.id)===String(t.categoryId)));if(orphanCat.length)issues.push({tone:'warn',text:`${orphanCat.length} transaction${orphanCat.length===1?'':'s'} reference a missing category.`});
 const orphanPantry=arr(state.groceryLists).flatMap(l=>arr(l.items)).filter(i=>i.pantryItemId&&!arr(state.pantry).some(p=>String(p.id)===String(i.pantryItemId)));if(orphanPantry.length)issues.push({tone:'warn',text:`${orphanPantry.length} grocery item${orphanPantry.length===1?'':'s'} link to missing Pantry records.`});
 const pending=arr(state.transactions).filter(t=>t.status==='pending').length;
 const transfers=arr(state.transactions).filter(t=>t.isTransfer).length;
 return {issues,pending,transfers,records:arr(state.transactions).length+arr(state.entries).length+arr(state.notes).length+arr(state.groceryLists).length+arr(state.pantry).length};
}
V56.normalize=normalize56;V56.health=health56;
// Normalize before every save, while preserving the entire existing save/render chain.
const saveBase56=window.saveState;
if(typeof saveBase56==='function'&&!saveBase56.__v56){const wrapped=function(){normalize56();return saveBase56.apply(this,arguments)};wrapped.__v56=true;window.saveState=wrapped}
normalize56();

function clearedExpenses(date=today()){return arr(state.transactions).filter(t=>t.type==='expense'&&t.status!=='pending'&&!t.isTransfer&&t.date===date)}
function dailyStats56(){
 const k=today(),tasks=arr(state.entries),openToday=tasks.filter(t=>t.status!=='completed'&&t.date===k),over=tasks.filter(t=>t.status!=='completed'&&t.date&&t.date<k),events=arr(state.calendarEvents).filter(e=>e.date===k),spend=clearedExpenses(k).reduce((s,t)=>s+num(t.amount),0),low=arr(state.pantry).filter(p=>!p.archived&&num(p.minQty)>0&&num(p.qty)<=num(p.minQty)),habits=arr(state.habits),habitDone=habits.filter(h=>h.log?.[k]).length;return {openToday,over,events,spend,low,habits,habitDone};
}
function openQuick(type){
 if(type==='task')return window.openTaskModal?openTaskModal():window.OmniV55?.capture?.();
 if(type==='event')return window.openCalendarEventModal?openCalendarEventModal():window.OmniV55?.capture?.();
 if(type==='expense')return window.openFinanceTransactionV38?openFinanceTransactionV38(null,'expense'):window.openTxnModal?.();
 if(type==='grocery')return window.openGroceryModal?.();
 if(type==='note')return window.openNoteModal?.();
 if(type==='capture')return window.OmniV55?.capture?.();
}
function renderDaily56(){
 ensure56();const view=document.getElementById('view-today');if(!view||!view.classList.contains('active'))return;
 let host=document.getElementById('v56-daily');if(!host){host=document.createElement('section');host.id='v56-daily';host.className='v56-daily';const root=view.querySelector('[id^="v35-today-root"]')||view.firstElementChild||view;root.prepend(host)}
 const s=dailyStats56(),d=state.v56.daily[today()],goal=Math.max(1,num(state.v56.settings.waterGoal,8));
 host.innerHTML=`<div class="v56-daily-head"><div><div class="v56-daily-title">Daily essentials</div><div class="v56-daily-sub">One compact place for the things you are most likely to touch every day.</div></div><div class="v56-daily-actions"><button class="btn btn-sm" data-v56-quick="task">+ Task</button><button class="btn btn-sm" data-v56-quick="event">+ Event</button><button class="btn btn-sm" data-v56-quick="expense">+ Expense</button><button class="btn btn-sm" data-v56-quick="grocery">+ Grocery</button><button class="btn btn-sm" data-v56-quick="note">+ Note</button><button class="btn btn-sm btn-primary" data-v56-quick="capture">Quick Capture</button></div></div><div class="v56-daily-grid"><div class="v56-daily-card clickable" data-v56-go="tasks"><div class="v56-daily-l">Tasks</div><div class="v56-daily-v">${s.openToday.length}${s.over.length?` + ${s.over.length}`:''}</div><div class="v56-daily-m">${s.openToday.length} today${s.over.length?` · ${s.over.length} overdue`:''}</div></div><div class="v56-daily-card clickable" data-v56-go="master-calendar"><div class="v56-daily-l">Schedule</div><div class="v56-daily-v">${s.events.length}</div><div class="v56-daily-m">event${s.events.length===1?'':'s'} today</div></div><div class="v56-daily-card clickable" data-v56-go="habits"><div class="v56-daily-l">Habits</div><div class="v56-daily-v">${s.habitDone}/${s.habits.length}</div><div class="v56-daily-m">completed today</div></div><div class="v56-daily-card clickable" data-v56-go="budget"><div class="v56-daily-l">Spent today</div><div class="v56-daily-v">${esc(money(s.spend))}</div><div class="v56-daily-m">cleared expenses only</div></div><div class="v56-daily-card clickable" data-v56-go="pantry"><div class="v56-daily-l">Low stock</div><div class="v56-daily-v">${s.low.length}</div><div class="v56-daily-m">Pantry item${s.low.length===1?'':'s'} to review</div></div></div><div class="v56-daily-bottom"><div><label class="form-label" for="v56-daily-note">Daily note</label><textarea id="v56-daily-note" class="form-textarea v56-note" placeholder="Anything worth remembering today…">${esc(d.note)}</textarea></div><div><label class="form-label">Water</label><div class="v56-water"><button class="btn btn-sm" id="v56-water-minus">−</button><strong>${d.water}/${goal}</strong><button class="btn btn-sm" id="v56-water-plus">+</button><button class="btn btn-sm" id="v56-water-reset">Reset</button></div><div class="v56-daily-m" style="margin-top:7px">A lightweight manual counter; change the daily goal in System Health.</div></div></div>`;
 host.querySelectorAll('[data-v56-quick]').forEach(b=>b.onclick=()=>openQuick(b.dataset.v56Quick));
 host.querySelectorAll('[data-v56-go]').forEach(b=>b.onclick=()=>window.switchView?.(b.dataset.v56Go));
 let timer;host.querySelector('#v56-daily-note').oninput=e=>{d.note=e.target.value;d.updatedAt=new Date().toISOString();clearTimeout(timer);timer=setTimeout(()=>window.saveState?.(),450)};

}
function renderHealth56(){

<script id="omnios-v561-calendar-filter-fix-js">
(function(){
  'use strict';
  if(window.__omniCalendarFilterFix561)return;
  window.__omniCalendarFilterFix561=true;
  window.__omniCalendarFilterPanelOpen=false;

  const DEFS=[
    ['event','Events','●','#ec4899'],['timeblock','Time blocks','▣','#06b6d4'],['task','Tasks due','✓','#3b82f6'],['deadline','Deadlines','◆','#f59e0b'],['workout','Workouts','🏋️','#ef4444'],['habit','Habit activity','⚡','#10b981'],['focus','Focus activity','◷','#14b8a6'],['finance','Finance activity','↗','#eab308'],['note','Note activity','▤','#a855f7']
  ];
  const PRESETS={
    planning:{event:true,timeblock:true,task:true,deadline:true,workout:true,habit:false,focus:false,finance:false,note:false},
    life:{event:true,timeblock:true,task:true,deadline:true,workout:true,habit:true,focus:false,finance:false,note:false},
    activity:{event:true,timeblock:true,task:true,deadline:true,workout:true,habit:true,focus:true,finance:true,note:true}
  };

  function workspace(){
    state.settings=state.settings||{};
    state.settings.calendar=state.settings.calendar||{};
    let ws=state.settings.calendar.workspace;
    if(!ws||typeof ws!=='object')ws=state.settings.calendar.workspace={};
    if(!ws.filters||typeof ws.filters!=='object')ws.filters={};
    return ws;
  }
  function currentValue(key){
    try{return masterCalendarFilters[key]!==false}catch(_){return workspace().filters[key]!==false}
  }
  function setCurrent(key,value){
    try{masterCalendarFilters[key]=!!value}catch(_){ }
    workspace().filters[key]=!!value;
  }
  function snapshot(){
    const f={};DEFS.forEach(([k])=>f[k]=currentValue(k));return f;
  }
  function persist(){
    const ws=workspace();ws.filters=snapshot();
    try{if(typeof masterCalendarMode!=='undefined')ws.mode=masterCalendarMode}catch(_){ }
    try{
      if(typeof storage!=='undefined'&&storage?.setItem)storage.setItem('omnios_v3_state',JSON.stringify(state));
      else localStorage.setItem('omnios_v3_state',JSON.stringify(state));
    }catch(_){ }
    try{window.omniOSUIPersistence?.capture?.()}catch(_){ }
  }
  function rerender(){
    try{window.renderMasterCalendar?.()}catch(e){console.warn('Calendar rerender:',e)}
    requestAnimationFrame(enhance);
  }
  function setPreset(name){
    const p=PRESETS[name];if(!p)return;
    DEFS.forEach(([k])=>setCurrent(k,p[k]!==false));
    workspace().preset=name;
    persist();window.__omniCalendarFilterPanelOpen=true;rerender();
  }
  function setAll(value){
    DEFS.forEach(([k])=>setCurrent(k,value));workspace().preset='custom';persist();window.__omniCalendarFilterPanelOpen=true;rerender();
  }
  function invert(){
    DEFS.forEach(([k])=>setCurrent(k,!currentValue(k)));workspace().preset='custom';persist();window.__omniCalendarFilterPanelOpen=true;rerender();
  }

  function enhance(){
    const panel=document.getElementById('v36-filter-panel'),toggle=document.getElementById('v36-filter-btn');
    if(!panel||!toggle)return;
    const all=document.getElementById('v36-filter-all'),plan=document.getElementById('v36-filter-plan');
    if(all)all.textContent='Select all';if(plan)plan.textContent='Planning only';

    let actions=panel.querySelector('.v36-filter-actions');
    if(!actions){
      actions=document.createElement('div');actions.className='v36-filter-actions';
      const summary=document.createElement('span');summary.className='v36-filter-summary';actions.appendChild(summary);
      if(all)actions.appendChild(all);
      const clear=document.createElement('button');clear.type='button';clear.className='btn btn-sm';clear.id='v561-filter-none';clear.textContent='Clear all';actions.appendChild(clear);
      const inv=document.createElement('button');inv.type='button';inv.className='btn btn-sm';inv.id='v561-filter-invert';inv.textContent='Invert';actions.appendChild(inv);
      if(plan)actions.appendChild(plan);panel.appendChild(actions);
    }
    const selected=DEFS.filter(([k])=>currentValue(k)).length;
    const summary=panel.querySelector('.v36-filter-summary');if(summary)summary.textContent=`${selected} of ${DEFS.length} shown`;
    panel.querySelectorAll('[data-v36-filter]').forEach(input=>{
      const key=input.dataset.v36Filter;input.checked=currentValue(key);
      const chip=input.closest('.v36-cal-filter-chip');if(chip){const def=DEFS.find(([k])=>k===key);if(def?.[3])chip.style.setProperty('--chip-color',def[3]);chip.classList.toggle('is-selected',input.checked)}
    });
    panel.classList.toggle('open',!!window.__omniCalendarFilterPanelOpen);
    toggle.setAttribute('aria-expanded',window.__omniCalendarFilterPanelOpen?'true':'false');toggle.setAttribute('aria-controls','v36-filter-panel');
  }

  // Capture before the private v36 module handlers. This is the key fix: write the NEW
  // filter state to workspace.filters before the v36 ensure routine gets a chance to restore old values.
  document.addEventListener('change',function(e){
    const input=e.target.closest?.('[data-v36-filter]');if(!input)return;
    e.stopImmediatePropagation();
    const key=input.dataset.v36Filter;setCurrent(key,!!input.checked);workspace().preset='custom';persist();window.__omniCalendarFilterPanelOpen=true;rerender();
  },true);

  document.addEventListener('click',function(e){
    const btn=e.target.closest?.('#v36-filter-btn,#v36-filter-all,#v36-filter-plan,#v561-filter-none,#v561-filter-invert,[data-v36-preset]');if(!btn)return;
    e.preventDefault();e.stopImmediatePropagation();
    if(btn.id==='v36-filter-btn'){
      window.__omniCalendarFilterPanelOpen=!window.__omniCalendarFilterPanelOpen;
      enhance();return;
    }
    if(btn.id==='v36-filter-all')return setAll(true);
    if(btn.id==='v561-filter-none')return setAll(false);
    if(btn.id==='v561-filter-invert')return invert();
    if(btn.id==='v36-filter-plan')return setPreset('planning');
    if(btn.matches('[data-v36-preset]'))return setPreset(btn.dataset.v36Preset);
  },true);

  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape'||!window.__omniCalendarFilterPanelOpen||document.querySelector('.modal-overlay.active'))return;
    window.__omniCalendarFilterPanelOpen=false;enhance();e.stopImmediatePropagation();
  },true);

  const root=document.getElementById('master-calendar-content');
  if(root){new MutationObserver(()=>requestAnimationFrame(enhance)).observe(root,{childList:true,subtree:true});}
  requestAnimationFrame(enhance);
})();

<script id="omnios-v56-task-kanban-dnd-js">
(function(){'use strict';
  const STATUSES=['todo','in-progress','completed'];
  const LABELS={todo:'To Do','in-progress':'In Progress',completed:'Completed'};
  let dragId=null;
  let suppressClickUntil=0;
  let queued=false;

  function eq(a,b){return String(a)===String(b)}
  function activeKanban(){return typeof currentTaskView!=='undefined'&&currentTaskView==='kanban'&&document.getElementById('view-tasks')?.classList.contains('active')}
  function getTask(id){return (state.entries||[]).find(t=>eq(t.id,id))}
  function colStatus(col,index){return col.dataset.taskStatus||STATUSES[index]||''}

  function addHint(){
    const host=document.getElementById('tasks-content');
    if(!host||host.querySelector('.task-dnd-hint')||!host.querySelector('.kanban-board'))return;
    const hint=document.createElement('div');
    hint.className='task-dnd-hint';
    hint.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7h8M8 12h8M8 17h8"/><path d="m5 7-2 2 2 2M19 7l2 2-2 2"/></svg><span>Drag a task card to another column to change its status.</span>';
    host.prepend(hint);
  }

  function clearOver(){document.querySelectorAll('#view-tasks .kanban-col.task-dnd-over').forEach(x=>x.classList.remove('task-dnd-over'))}

  function updateStatus(id,next){
    const task=getTask(id);
    if(!task||!STATUSES.includes(next)||task.status===next)return false;
    const prev=task.status;
    task.status=next;
    task.completed=next==='completed';
    task.updatedAt=new Date().toISOString();
    if(next==='completed') task.completedAt=task.completedAt||task.updatedAt;
    else task.completedAt=null;
    suppressClickUntil=Date.now()+500;
    try{window.saveState?.()}catch(e){console.warn('Task drag save:',e)}
    if(next==='completed'&&prev!=='completed'){
      try{if(typeof processRecurringTasks35==='function')processRecurringTasks35()}catch(e){console.warn('Recurring task processing:',e)}
    }
    try{window.toast?.(`Moved to ${LABELS[next]}`)}catch(_){ }
    return true;
  }

  function bindCard(card){
    if(card.dataset.taskDndBound==='1')return;
    card.dataset.taskDndBound='1';
    card.draggable=true;
    card.setAttribute('aria-grabbed','false');
    card.title=card.title||'Drag to another status column';
    card.addEventListener('dragstart',e=>{
      dragId=card.dataset.entryId;
      card.classList.add('task-dnd-dragging');
      card.setAttribute('aria-grabbed','true');
      suppressClickUntil=Date.now()+600;
      try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(dragId));e.dataTransfer.setDragImage(card,24,18)}catch(_){ }
    });
    card.addEventListener('dragend',()=>{
      dragId=null;
      card.classList.remove('task-dnd-dragging');
      card.setAttribute('aria-grabbed','false');
      clearOver();
      suppressClickUntil=Date.now()+220;
    });
    card.addEventListener('keydown',e=>{
      if(!(e.altKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight')))return;
      const t=getTask(card.dataset.entryId);if(!t)return;
      const i=STATUSES.indexOf(t.status),n=e.key==='ArrowRight'?Math.min(STATUSES.length-1,i+1):Math.max(0,i-1);
      if(n===i)return;
      e.preventDefault();updateStatus(t.id,STATUSES[n]);
    });
    if(!card.hasAttribute('tabindex'))card.tabIndex=0;
  }

  function bindColumn(col,index){
    const status=colStatus(col,index);if(!status)return;
    col.dataset.taskStatus=status;
    col.setAttribute('aria-label',`${LABELS[status]} task column`);
    const zone=col.querySelector('.kanban-cards')||col;
    if(zone.dataset.taskDndBound==='1')return;
    zone.dataset.taskDndBound='1';
    zone.addEventListener('dragenter',e=>{if(!dragId)return;e.preventDefault();clearOver();col.classList.add('task-dnd-over')});
    zone.addEventListener('dragover',e=>{if(!dragId)return;e.preventDefault();try{e.dataTransfer.dropEffect='move'}catch(_){ }clearOver();col.classList.add('task-dnd-over')});
    zone.addEventListener('dragleave',e=>{if(!col.contains(e.relatedTarget))col.classList.remove('task-dnd-over')});
    zone.addEventListener('drop',e=>{
      e.preventDefault();e.stopPropagation();
      const id=dragId||(()=>{try{return e.dataTransfer.getData('text/plain')}catch(_){return ''}})();
      clearOver();
      if(!id)return;
      const task=getTask(id);
      if(!task||task.status===status){suppressClickUntil=Date.now()+250;return}
      updateStatus(id,status);
    });
  }

  function enhance(){
    if(typeof currentTaskView==='undefined'||currentTaskView!=='kanban')return;
    const board=document.querySelector('#view-tasks #tasks-content .kanban-board');if(!board)return;
    [...board.querySelectorAll(':scope > .kanban-col')].forEach(bindColumn);
    board.querySelectorAll('.kanban-card[data-entry-id]').forEach(bindCard);
    addHint();
  }

  document.addEventListener('click',e=>{
    if(Date.now()>=suppressClickUntil)return;
    if(e.target.closest('#view-tasks .kanban-card[data-entry-id]')){e.preventDefault();e.stopImmediatePropagation()}
  },true);

<script id="omnios-v56-premium-task-board-js">
(function(){'use strict';
  const META={
    'todo':{title:'To Do',sub:'Ideas and tasks ready to get started.',icon:'○'},

  let queued=false;

  function closeMenu(){document.getElementById('omni-task-board-menu')?.classList.remove('open')}
  function openColumnMenu(btn,status){const m=menu(),meta=META[status]||META.todo;m.innerHTML=`<button data-board-menu="add">＋ Add task to ${esc(meta.title)}</button><button data-board-menu="only">◉ Show only ${esc(meta.title)}</button><button data-board-menu="all">◎ Show all statuses</button>`;m.querySelector('[data-board-menu="add"]').onclick=()=>{closeMenu();openNew(status)};m.querySelector('[data-board-menu="only"]').onclick=()=>{closeMenu();showOnly(status)};m.querySelector('[data-board-menu="all"]').onclick=()=>{closeMenu();showAll()};const r=btn.getBoundingClientRect();m.classList.add('open');m.style.left='0';m.style.top='0';const mr=m.getBoundingClientRect();m.style.left=Math.max(8,Math.min(r.right-mr.width,innerWidth-mr.width-8))+'px';m.style.top=Math.max(8,Math.min(r.bottom+5,innerHeight-mr.height-8))+'px'}

  function decorateColumn(col,index){
    const status=col.dataset.taskStatus||['todo','in-progress','completed'][index];if(!status)return;col.dataset.taskStatus=status;
    const meta=META[status]||META.todo,cards=[...col.querySelectorAll('.kanban-cards > .kanban-card[data-entry-id]')];

  schedule();setTimeout(schedule,150);
  window.OmniPremiumTaskBoard56={enhance,openNew};
})();
</script>
