<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18181b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OmniOS">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>OmniOS</title>
<style>
:root{color-scheme:dark;background:#0f0f11;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#0f0f11;color:#f4f4f5;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
.boot{width:min(340px,100%);text-align:center}.mark{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;background:#18181b;border:1px solid #2b2b30;display:grid;place-items:center;font-size:27px;font-weight:800;box-shadow:0 14px 40px #0006}
h1{font-size:24px;margin:0 0 6px}p{font-size:14px;line-height:1.45;color:#a1a1aa;margin:0}.bar{height:4px;background:#27272a;border-radius:999px;overflow:hidden;margin:24px 0 10px}.fill{height:100%;width:5%;background:#f4f4f5;border-radius:inherit;transition:width .18s ease}.status{font-size:12px;color:#71717a}.error{display:none;margin-top:18px;padding:14px;border:1px solid #3f3f46;border-radius:14px;text-align:left}.error button{margin-top:12px;width:100%;min-height:44px;border:0;border-radius:12px;font-weight:700}
</style>
</head>
<body>
<main class="boot">
<div class="mark">O</div><h1>OmniOS</h1><p>Preparing your personal workspace…</p>
<div class="bar"><div class="fill" id="fill"></div></div><div class="status" id="status">Loading 0%</div>
<div class="error" id="error"><strong>OmniOS couldn't finish loading.</strong><p style="margin-top:6px">Check your connection once, then retry. After the first successful load OmniOS can work offline.</p><button onclick="location.reload()">Retry</button></div>
</main>
<script>
(()=>{const PARTS=["./app-parts/part-001.html","./app-parts/part-002.html","./app-parts/part-003.html","./app-parts/part-004.html","./app-parts/part-005.html","./app-parts/part-006.html","./app-parts/part-007.html","./app-parts/part-008.html","./app-parts/part-009.html","./app-parts/part-010.html","./app-parts/part-011.html","./app-parts/part-012.html","./app-parts/part-013.html","./app-parts/part-014.html","./app-parts/part-015.html","./app-parts/part-016.html","./app-parts/part-017.html","./app-parts/part-018.html","./app-parts/part-019.html","./app-parts/part-020.html","./app-parts/part-021.html","./app-parts/part-022.html","./app-parts/part-023.html","./app-parts/part-024.html","./app-parts/part-025.html","./app-parts/part-026.html","./app-parts/part-027.html","./app-parts/part-028.html"],CACHE='omnios-v63.0-static-pwa',fill=document.getElementById('fill'),status=document.getElementById('status');
async function one(url){try{const r=await fetch(url);if(!r.ok)throw new Error(r.status);try{const c=await caches.open(CACHE);await c.put(url,r.clone())}catch{}return await r.text()}catch(e){const c=await caches.match(url);if(c)return await c.text();throw e}}
(async()=>{try{const texts=new Array(PARTS.length);let next=0,done=0;const worker=async()=>{while(true){const i=next++;if(i>=PARTS.length)return;texts[i]=await one(PARTS[i]);done++;const pct=Math.round((done/PARTS.length)*100);fill.style.width=pct+'%';status.textContent='Loading '+pct+'%'}};await Promise.all(Array.from({length:Math.min(6,PARTS.length)},worker));const html=texts.join('');document.open();document.write(html);document.close()}catch(e){console.error(e);document.getElementById('error').style.display='block';status.textContent='Load failed'}})()})();
</script>
</body></html>
