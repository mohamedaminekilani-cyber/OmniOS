<script id="omnios-pwa-icon-early">
(function(){
  function safeImageSrc(value,allowData){
    value=String(value||'').trim();
    if(!value)return '';
    if(allowData&&/^data:image\/(?:png|jpeg|webp);base64,[a-z0-9+/=\s]+$/i.test(value))return value;
    try{
      var u=new URL(value,location.href);
      if(u.origin===location.origin||u.origin==='https://omnios-pwa.netlify.app')return u.href;
    }catch(_){}
    return '';
  }
  window.__omniSafeImageSrc=safeImageSrc;
  try{
    var qs=new URLSearchParams(location.search);
    var id=(qs.get('pwaIcon')||'').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,120);
    var rev=(qs.get('pwaIconRev')||'').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,80);
    var href='';
    if(id)href='https://omnios-pwa.netlify.app/api/icon?id='+encodeURIComponent(id)+(rev?'&v='+encodeURIComponent(rev):'');
    if(!href)href=safeImageSrc(localStorage.getItem('omnios_app_icon_public_v1')||'',false);
    if(href){
      var old=document.getElementById('omnios-apple-touch-icon');if(old)old.remove();
      var link=document.createElement('link');link.id='omnios-apple-touch-icon';link.rel='apple-touch-icon';link.href=href;document.head.appendChild(link);

  }catch(_){}
})();
</script>

<script>
(()=>{
const PARTS=Array.from({length:28},function(_,i){return './app-parts/part-'+String(i+1).padStart(3,'0')+'.html'});
const SNAPSHOT_PREFIX='omnios-app-snapshot-v1-';
const SNAPSHOT_SLOT_KEY='omnios_app_snapshot_slot_v1';
const SNAPSHOT_META='./__omnios_snapshot_meta__';
const USER_ASSET_CACHE='omnios-user-assets-v1';
const MIN_PART_LENGTH=120000;
const fill=document.getElementById('fill'),status=document.getElementById('status'),progress=document.getElementById('omnios-boot-progress'),track=document.querySelector('.omnios-boot-track');
const retryBtn=document.getElementById('omnios-retry-btn'),resetBtn=document.getElementById('omnios-reset-cache-btn');
function setProgress(done,label){
  const pct=Math.max(0,Math.min(100,Math.round((done/PARTS.length)*100)));
  if(fill)fill.style.width=pct+'%';
  if(progress)progress.style.width=pct+'%';
  if(track)track.setAttribute('aria-valuenow',String(pct));
  if(status)status.textContent=(label||'Loading')+' · '+pct+'%';
}
function retryNow(){
  if(retryBtn){retryBtn.disabled=true;retryBtn.textContent='Retrying…'}
  if(resetBtn)resetBtn.disabled=true;
  const boot=document.querySelector('.boot');boot?.classList.remove('failed');
  if(status)status.textContent=navigator.onLine?'Retrying…':'Offline · checking saved copy…';
  setTimeout(()=>location.reload(),80);
}
retryBtn?.addEventListener('click',retryNow);
resetBtn?.addEventListener('click',()=>{if(resetBtn){resetBtn.disabled=true;resetBtn.textContent='Resetting…'}if(retryBtn)retryBtn.disabled=true;window.resetOmniAppCache?.()});
function hashText(text){
  let h=2166136261;
  for(let i=0;i<text.length;i++)h=Math.imul(h^text.charCodeAt(i),16777619);
  return (h>>>0).toString(36);
}
function validatePart(text,index){
  if(typeof text!=='string'||text.length<MIN_PART_LENGTH)return false;
  if(index===0&&!/^\s*<!doctype html>/i.test(text.slice(0,300)))return false;
  if(index===PARTS.length-1&&(!/<\/html>\s*$/i.test(text)||((text.match(/<\/html>/gi)||[]).length!==1)))return false;
  const head=text.slice(0,4000).toLowerCase();
  if(head.includes('<title>sign in')||head.includes('captive portal')||head.includes('network login'))return false;
  return true;
}
async function fetchAttempt(url,index,timeoutMs){
  const ctrl=typeof AbortController!=='undefined'?new AbortController():null;
  const timer=ctrl?setTimeout(function(){ctrl.abort()},timeoutMs):null;
  try{
    const response=await fetch(url,{signal:ctrl&&ctrl.signal,cache:'no-cache',credentials:'same-origin'});
    if(!response.ok)throw new Error('HTTP '+response.status+' for '+url);
    const finalUrl=new URL(response.url||url,location.href);
    if(finalUrl.origin!==location.origin)throw new Error('Unexpected redirect for '+url);
    const type=(response.headers.get('content-type')||'').toLowerCase();
    if(type&&!type.includes('text/html')&&!type.includes('text/plain'))throw new Error('Unexpected content type for '+url);
    const text=await response.text();
    if(!validatePart(text,index))throw new Error('Content validation failed for '+url);
    return text;
  }finally{
    if(timer)clearTimeout(timer);
  }
}
async function fetchPart(url,index){
  let lastError=null;
  for(const timeoutMs of [10000,20000]){
    try{return await fetchAttempt(url,index,timeoutMs)}catch(e){lastError=e}
  }
  throw lastError||new Error('Could not load '+url);
}
async function fetchFreshSet(){
  const texts=new Array(PARTS.length);
  const errors=[];
  let next=0,done=0;
  async function worker(){
    while(true){
      const index=next++;
      if(index>=PARTS.length)return;
      try{texts[index]=await fetchPart(PARTS[index],index)}
      catch(e){errors.push({index:index,error:e})}
      finally{done++;setProgress(done,'Checking')}
    }
  }
  await Promise.all(Array.from({length:Math.min(6,PARTS.length)},worker));
  if(errors.length){
    const first=errors[0];
    throw new Error((first.error&&first.error.message?first.error.message:'Part load failed')+' ('+errors.length+' part'+(errors.length===1?'':'s')+')');
  }
  return texts;
}
async function readSlot(slot){
  if(!('caches'in window))return null;
  try{
    const cache=await caches.open(SNAPSHOT_PREFIX+slot);
    const metaResponse=await cache.match(SNAPSHOT_META);
    if(!metaResponse)return null;
    const meta=await metaResponse.json();
    if(!meta||meta.version!==1||!Array.isArray(meta.parts)||meta.parts.length!==PARTS.length)return null;
    const texts=new Array(PARTS.length);
    for(let i=0;i<PARTS.length;i++){
      const response=await cache.match(PARTS[i]);
      if(!response)return null;
      const text=await response.text();
      const expected=meta.parts[i]||{};
      if(!validatePart(text,i)||text.length!==expected.length||hashText(text)!==expected.hash)return null;
      texts[i]=text;
    }
    return texts;
  }catch(e){
    console.warn('Second Brain snapshot read failed',e);
    return null;
  }
}
async function readSnapshot(){
  let active='';
  try{active=localStorage.getItem(SNAPSHOT_SLOT_KEY)||''}catch(_){}
  const order=active==='a'?['a','b']:active==='b'?['b','a']:['a','b'];
  for(const slot of order){
    const texts=await readSlot(slot);
    if(texts){
      try{localStorage.setItem(SNAPSHOT_SLOT_KEY,slot)}catch(_){}
      return texts;
    }
  }
  return null;
}
async function writeSnapshot(texts){
  if(!('caches'in window))return false;
  let active='';
  try{active=localStorage.getItem(SNAPSHOT_SLOT_KEY)||''}catch(_){}
  const target=active==='a'?'b':'a';
  const name=SNAPSHOT_PREFIX+target;
  try{
    await caches.delete(name);
    const cache=await caches.open(name);
    const meta={version:1,savedAt:new Date().toISOString(),parts:[]};
    for(let i=0;i<PARTS.length;i++){
      const text=texts[i];
      meta.parts.push({length:text.length,hash:hashText(text)});
      await cache.put(PARTS[i],new Response(text,{headers:{'Content-Type':'text/html; charset=utf-8','Cache-Control':'no-store'}}));
    }
    await cache.put(SNAPSHOT_META,new Response(JSON.stringify(meta),{headers:{'Content-Type':'application/json','Cache-Control':'no-store'}}));
    const verified=await readSlot(target);
    if(!verified)throw new Error('Snapshot verification failed');
    try{localStorage.setItem(SNAPSHOT_SLOT_KEY,target)}catch(_){}
    return true;
  }catch(e){
    console.warn('Second Brain snapshot write failed',e);
    try{await caches.delete(name)}catch(_){}
    return false;
  }
}
window.resetOmniAppCache=async function(){
  try{
    if('caches'in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(function(k){return k!==USER_ASSET_CACHE&&(k==='secondbrain-releases-v1'||k.indexOf('omnios-')===0||k.indexOf('omnios-app-')===0)}).map(function(k){return caches.delete(k)}));
    }
    try{localStorage.removeItem(SNAPSHOT_SLOT_KEY)}catch(_){}
    try{
      const reg=await navigator.serviceWorker?.getRegistration?.();
      await reg?.update?.();
    }catch(_){}
  }finally{
    location.reload();
  }
};

function addRootClass(html,className){
  return html.replace(/<html([^>]*)>/i,function(full,attrs){
    if(/\bclass\s*=/.test(attrs)){
      return '<html'+attrs.replace(/\bclass\s*=\s*(["'])(.*?)\1/i,function(m,q,v){return 'class='+q+v+' '+className+q})+'>';
    }
    return '<html'+attrs+' class="'+className+'">';
  });
}

  const rootClasses='omnios-startup-gate'+(hasIcon?' omnios-has-boot-icon':'');
  const gateCss='\n<style id="omnios-startup-gate-css">\n'+baseStyle.textContent+'\nhtml.omnios-startup-gate body{overflow:hidden!important}\nhtml.omnios-startup-gate body>*:not(#omnios-boot-screen){visibility:hidden!important;pointer-events:none!important}\n#omnios-boot-screen{background:var(--bg-base,#0f0f11);opacity:1;transition:opacity .18s ease}\n#omnios-boot-screen.is-leaving{opacity:0;pointer-events:none}\n</style>';
  const currentUiAuthorityCss='\n<style id="second-brain-current-ui-authority">\n/* Keep only the current visual authority on migrated pages. */\n#view-today>.v35-page-head,#view-today>.v35-stat-grid,#view-today>.v35-card,#view-today>.v35-grid,#view-today>.v56-daily{display:none!important}\n#view-today>#v58-attention,#view-today>#v58-today-intelligence{display:grid}\n#view-today>#v58-attention{display:flex}\n#view-inbox>.v35-page-head,#view-projects>.v35-page-head{display:none!important}\n#sb-inbox-authority-head,#sb-projects-authority-head{margin-bottom:12px}\n#view-inbox.v58-inbox-captures-hidden>.v35-list{display:none!important}\n</style>';
  const currentUiAuthorityScript='<script id="second-brain-high-priority-authority">\n(function(){\n\'use strict\';\nlet inboxBusy=false,projectsBusy=false;\nfunction head(view,id,kicker,title,copy,action){\n  let h=document.getElementById(id);\n  if(!h){h=document.createElement(\'div\');h.id=id;h.className=\'v58-page-head sb-authority-head\';h.innerHTML=\'<div><div class="v35-kicker"></div><h3></h3><p></p></div><div class="v35-page-actions"><button type="button" class="btn btn-primary" data-sb-authority-action></button></div>\';}\n  h.querySelector(\'.v35-kicker\').textContent=kicker;h.querySelector(\'h3\').textContent=title;h.querySelector(\'p\').textContent=copy;\n  const b=h.querySelector(\'[data-sb-authority-action]\');b.textContent=action.label;b.onclick=action.run;\n  return h;\n}\nfunction decorateInbox(){\n  const view=document.getElementById(\'view-inbox\');if(!view||inboxBusy)return;inboxBusy=true;\n  try{\n    const old=view.querySelector(\'.v35-page-head\'),process=old?.querySelector(\'#v35-inbox-process\');\n    const h=head(view,\'sb-inbox-authority-head\',\'CAPTURE · TRIAGE\',\'Inbox\',\'Capture quickly, then process only what needs a destination.\',{label:\'Process oldest\',run:()=>process?.click()});\n    const anchor=view.querySelector(\'#v58-inbox-tabs\')||view.querySelector(\'.v35-card\')||view.firstElementChild;\n    if(anchor&&h.parentNode!==view)view.insertBefore(h,anchor);else if(anchor&&h.nextElementSibling!==anchor)view.insertBefore(h,anchor);\n  }finally{inboxBusy=false}\n}\nfunction decorateProjects(){\n  const view=document.getElementById(\'view-projects\');if(!view||projectsBusy)return;projectsBusy=true;\n  try{\n    const old=view.querySelector(\'.v35-page-head\'),add=old?.querySelector(\'#v35-project-add\');\n    const h=head(view,\'sb-projects-authority-head\',\'OUTCOMES · AREAS\',\'Projects & Life Areas\',\'Keep projects, areas and someday items in one outcome-focused workspace.\',{label:(add?.textContent||\'+ Project\').trim(),run:()=>add?.click()});\n    const seg=view.querySelector(\'.v35-segmented\');if(seg&&h.parentNode!==view)view.insertBefore(h,seg);else if(seg&&h.nextElementSibling!==seg)view.insertBefore(h,seg);\n    if(seg&&!seg.querySelector(\'[data-v58-project-relations]\')){const b=document.createElement(\'button\');b.type=\'button\';b.dataset.v58ProjectRelations=\'1\';b.textContent=\'Relations\';b.onclick=()=>window.switchView?.(\'relations\');seg.appendChild(b);}\n    if(seg&&!view.querySelector(\'#v58-project-kpis\')&&typeof state!==\'undefined\'){\n      const ps=Array.isArray(state.life?.projects)?state.life.projects:[],active=ps.filter(p=>p.status===\'active\'),done=ps.filter(p=>p.status===\'completed\'),today=(window.localDateString?localDateString():new Date().toISOString().slice(0,10)),overdue=active.filter(p=>p.targetDate&&p.targetDate<today),linked=ps.reduce((n,p)=>n+(Array.isArray(p.taskIds)?p.taskIds.length:0)+(Array.isArray(p.noteIds)?p.noteIds.length:0),0);\n      const k=document.createElement(\'div\');k.id=\'v58-project-kpis\';k.className=\'v58-kpis v58-project-kpis\';[[\'Active\',active.length],[\'Completed\',done.length],[\'Overdue\',overdue.length],[\'Linked records\',linked]].forEach(([label,value])=>{const x=document.createElement(\'div\');x.className=\'v58-kpi\';const a=document.createElement(\'span\'),b=document.createElement(\'strong\');a.textContent=label;b.textContent=String(value);x.append(a,b);k.appendChild(x)});seg.after(k);\n    }\n  }finally{projectsBusy=false}\n}\nfunction cleanCalendar(){document.getElementById(\'omnios-v624-mobile-calendar-fit-css\')?.remove();document.documentElement.dataset.calendarAuthority=\'v94-v96\';}\nfunction decorate(){cleanCalendar();decorateInbox();decorateProjects();}\nfunction observe(id,fn){const v=document.getElementById(id);if(!v)return;let queued=false;new MutationObserver(()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;fn()})}).observe(v,{childList:true});}\nfunction ready(){decorate();observe(\'view-inbox\',decorateInbox);observe(\'view-projects\',decorateProjects);}\nif(document.readyState===\'loading\')document.addEventListener(\'DOMContentLoaded\',ready,{once:true});else ready();\n})();\n<\\/script>';
  const bootHtml=boot.outerHTML;

(async()=>{
  try{
    // Cache failures must not prevent an online launch (private mode / full storage).
    let releaseCache;
    try{releaseCache=await caches.open('secondbrain-releases-v1')}catch(_){
      releaseCache={match:async()=>undefined,put:async()=>{}};
    }
    async function cacheRelease(key,response){
      try{await releaseCache.put(key,response)}catch(e){console.warn('Offline app cache unavailable',e)}
    }
    const activeKey=new URL('./__active_release__',location.href).href;
    const dismissedKey='omnios_update_dismissed_v1';
    let currentManifest=null,checkingUpdate=false,promptingSha='';

    async function installed(){
      const pointer=await releaseCache.match(activeKey);if(!pointer)return null;
      const m=await pointer.json(),r=await releaseCache.match(new URL(m.file,location.href).href);
      if(!r)return null;const text=await r.text();
      return await verified(m,text)?{m,text}:null;
    }

    async function verified(m,text){
      if(m?.version!==1||!/^app\.[a-f0-9]{20}\.html$/.test(m.file)||!/^[a-f0-9]{64}$/.test(m.sha256))return false;
      const bytes=new TextEncoder().encode(text);if(bytes.length!==m.bytes)return false;
      const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),x=>x.toString(16).padStart(2,'0')).join('');
      return hash===m.sha256;
    }

    async function requestReleaseFile(path){
      const ctrl=new AbortController();
      const timer=setTimeout(()=>ctrl.abort(),20000);
      try{return await fetch(path,{cache:'no-store',signal:ctrl.signal})}
      finally{clearTimeout(timer)}
    }

    async function sourceText(m){
      // Branch-based Pages serves source files. Validate the assembled result with
      // the SAME checksum as the atomic Actions build before executing anything.
      const parts=Array.from({length:28},(_,i)=>`app-parts/part-${String(i+1).padStart(3,'0')}.html`);
      if(JSON.stringify(m.parts)!==JSON.stringify(parts)||!Array.isArray(m.modules)||m.modules.length>20||
        m.modules.some(p=>! /^(?:js\/[a-z0-9-]+\.js|pwa-personalization\.js)$/.test(p)))throw Error('Invalid source release');
      const paths=[...parts,...new Set(m.modules)],files=new Map();let next=0,done=0;
      await Promise.all(Array.from({length:6},async()=>{
        while(next<paths.length){
          const path=paths[next++],r=await requestReleaseFile('./'+path);
          if(!r.ok)throw Error('Source release unavailable: '+path);
          files.set(path,await r.text());done++;
          if(!currentManifest)setProgress(Math.round(done/paths.length*PARTS.length),'Checking');
        }
      }));
      return parts.map(p=>files.get(p)).join('').replace(/<script\b[^>]*\bsrc=["'](\.\/)?(js\/[^"']+|pwa-personalization\.js)["'][^>]*><\/script>/gi,
        (_,prefix,file)=>{if(!files.has(file))throw Error('Missing release module');return '<script>\n'+files.get(file).replace(/<\/script/gi,'<\\/script')+'\n<\/script>'});
    }

    async function fetchLatest(options={}){
      const activate=options.activate===true;
      let r=await requestReleaseFile('./release.json'),source=false;
      if(r.status===404){r=await requestReleaseFile('./source-release.json');source=true}
      if(!r.ok)throw Error('Release manifest unavailable');
      const m=await r.json();
      if(!/^app\.[a-f0-9]{20}\.html$/.test(m.file||''))throw Error('Invalid release manifest');
      const url=new URL(m.file,location.href).href;
      let text='';
      try{const cached=await releaseCache.match(url);if(cached)text=await cached.text()}catch(_){}
      if(!text||!await verified(m,text)){
        if(source)text=await sourceText(m);
        else{
          const app=await requestReleaseFile(url);
          if(!app.ok)throw Error('Release unavailable');
          text=await app.text();
        }
        if(!await verified(m,text))throw Error('Release checksum failed');
        await cacheRelease(url,new Response(text,{headers:{'Content-Type':'text/html'}}));
      }
      if(activate)await cacheRelease(activeKey,new Response(JSON.stringify(m),{headers:{'Content-Type':'application/json'}}));
      return {m,text};
    }

    function updateSubject(m){
      const s=String(m?.subject||'').trim().replace(/\s+/g,' ');
      return s||'Second Brain improvements';
    }

    function ensureUpdateStyle(){
      if(document.getElementById('omnios-update-prompt-style'))return;
      const st=document.createElement('style');st.id='omnios-update-prompt-style';
      st.textContent=
        '#omnios-update-prompt{position:fixed;z-index:2147483000;right:18px;bottom:18px;width:min(390px,calc(100vw - 24px));font-family:inherit;color:var(--text-primary,#f4f4f5);background:color-mix(in srgb,var(--bg-surface,#18181b) 94%,#000 6%);border:1px solid var(--border-light,#3f3f46);border-radius:18px;box-shadow:0 22px 64px rgba(0,0,0,.44);padding:14px;display:grid;grid-template-columns:42px minmax(0,1fr);gap:11px;animation:omniosUpdateIn .22s ease both;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}'+
        '#omnios-update-prompt .oup-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent-cyan,#06b6d4) 15%,var(--bg-elevated,#27272a));color:var(--accent-cyan,#06b6d4);border:1px solid color-mix(in srgb,var(--accent-cyan,#06b6d4) 28%,var(--border-color,#27272a))}'+
        '#omnios-update-prompt .oup-icon svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}'+
        '#omnios-update-prompt .oup-main{min-width:0}#omnios-update-prompt .oup-kicker{font-size:.58rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-cyan,#06b6d4)}'+
        '#omnios-update-prompt .oup-title{font-size:.88rem;font-weight:800;margin-top:3px}#omnios-update-prompt .oup-subject{font-size:.72rem;line-height:1.45;color:var(--text-secondary,#a1a1aa);margin-top:4px;overflow-wrap:anywhere}'+
        '#omnios-update-prompt .oup-meta{font-size:.56rem;color:var(--text-muted,#71717a);margin-top:5px}#omnios-update-prompt .oup-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:11px}'+
        '#omnios-update-prompt .oup-btn{min-height:38px;border-radius:10px;border:1px solid var(--border-color,#27272a);background:var(--bg-elevated,#27272a);color:var(--text-primary,#f4f4f5);font:inherit;font-size:.68rem;font-weight:750;padding:0 12px;cursor:pointer}'+
        '#omnios-update-prompt .oup-btn.primary{background:var(--accent-cyan,#06b6d4);border-color:var(--accent-cyan,#06b6d4);color:#001014}#omnios-update-prompt .oup-btn:disabled{opacity:.58;cursor:wait}'+
        '@keyframes omniosUpdateIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}'+
        '@media(max-width:760px){#omnios-update-prompt{left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));width:auto;border-radius:16px;padding:12px;grid-template-columns:38px minmax(0,1fr)}#omnios-update-prompt .oup-icon{width:38px;height:38px;border-radius:11px}#omnios-update-prompt .oup-actions{display:grid;grid-template-columns:1fr 1fr}#omnios-update-prompt .oup-btn{width:100%;min-height:42px}}';
      document.head.appendChild(st);
    }

    function showUpdatePrompt(m){
      if(!m||m.sha256===currentManifest?.sha256)return;
      try{if(sessionStorage.getItem(dismissedKey)===m.sha256)return}catch(_){}
      if(promptingSha===m.sha256&&document.getElementById('omnios-update-prompt'))return;
      promptingSha=m.sha256;
      ensureUpdateStyle();
      document.getElementById('omnios-update-prompt')?.remove();
      const card=document.createElement('aside');card.id='omnios-update-prompt';card.setAttribute('role','status');card.setAttribute('aria-live','polite');
      const shortCommit=String(m.commit||'').slice(0,7);
      card.innerHTML='<div class="oup-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg></div><div class="oup-main"><div class="oup-kicker">New update available</div><div class="oup-title">Second Brain is ready to update</div><div class="oup-subject"></div><div class="oup-meta"></div><div class="oup-actions"><button type="button" class="oup-btn" data-update-later>Later</button><button type="button" class="oup-btn primary" data-update-now>Update now</button></div></div>';
      card.querySelector('.oup-subject').textContent=updateSubject(m);
      card.querySelector('.oup-meta').textContent=shortCommit?'Build '+shortCommit:'A newer build is ready';
      card.querySelector('[data-update-later]').onclick=()=>{
        try{sessionStorage.setItem(dismissedKey,m.sha256)}catch(_){}
        card.remove();promptingSha='';
      };
      card.querySelector('[data-update-now]').onclick=async e=>{
        const btn=e.currentTarget,later=card.querySelector('[data-update-later]');
        btn.disabled=true;later.disabled=true;btn.textContent='Updating…';
        try{
          await releaseCache.put(activeKey,new Response(JSON.stringify(m),{headers:{'Content-Type':'application/json'}}));
          try{const reg=await navigator.serviceWorker?.getRegistration?.();await reg?.update?.()}catch(_){}
          location.reload();
        }catch(err){
          btn.disabled=false;later.disabled=false;btn.textContent='Update now';
          console.warn('Could not activate update',err);
        }
      };
      document.body.appendChild(card);
    }

    async function checkForUpdate(){
      if(checkingUpdate||!navigator.onLine||!currentManifest)return;
      checkingUpdate=true;
      try{
        const next=await fetchLatest();
        if(next.m.sha256!==currentManifest.sha256)showUpdatePrompt(next.m);
      }catch(e){
        console.info('Update check skipped',e.message);
      }finally{
        checkingUpdate=false;
      }
    }

    function startUpdateWatcher(){
      setTimeout(checkForUpdate,2200);
      setInterval(checkForUpdate,5*60*1000);
      window.addEventListener('focus',checkForUpdate);
      window.addEventListener('online',checkForUpdate);
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkForUpdate()});
    }

    const saved=await installed().catch(()=>null);
    const loaded=saved||await fetchLatest({activate:true});
    currentManifest=loaded.m;
    const html=carryLoaderIntoApp(loaded.text);
    document.open();
    document.write(html);
    document.close();
    startUpdateWatcher();
  }catch(e){
    console.error(e);
    document.querySelector('.boot')?.classList.add('failed');
    const copy=document.getElementById('omnios-load-error-copy');
    const offline=!navigator.onLine;
    if(copy)copy.textContent=offline
      ? 'This device is offline and no complete saved app copy was available. Reconnect once, then Retry. Your Second Brain data is not deleted.'
      : 'A complete app build could not be validated. Retry first; if it repeats, reset only the app cache. Your Second Brain data is not deleted.';
    const error=document.getElementById('error');if(error)error.style.display='block';
    if(status)status.textContent=offline?'Offline · saved copy unavailable':'Load failed · app files could not be validated';
    retryBtn?.focus?.();
  }
})();
})();
</script>

</body></html>
