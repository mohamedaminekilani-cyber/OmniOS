<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18181b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OmniOS">
<link id="omnios-apple-touch-icon" rel="apple-touch-icon" sizes="180x180" href="./icons/icon-192.png">
<script id="omnios-pwa-icon-early">
(function(){
  try{
    var qs=new URLSearchParams(location.search);
    var id=(qs.get('pwaIcon')||'').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,120);
    var rev=(qs.get('pwaIconRev')||'').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,80);
    var href='';
    if(id)href='https://omnios-pwa.netlify.app/api/icon?id='+encodeURIComponent(id)+(rev?'&v='+encodeURIComponent(rev):'');
    if(!href)href=localStorage.getItem('omnios_app_icon_public_v1')||'';
    if(href){
      var old=document.getElementById('omnios-apple-touch-icon');if(old)old.remove();
      var link=document.createElement('link');link.id='omnios-apple-touch-icon';link.rel='apple-touch-icon';link.setAttribute('sizes','180x180');link.href=href;document.head.appendChild(link);
    }
  }catch(_){}
})();
</script>
<link rel="manifest" href="./manifest.webmanifest">
<title>OmniOS</title>
<script id="omnios-accent-early">
(function(){
  try{
    const saved=JSON.parse(localStorage.getItem('omnios_v3_state')||'null');
    const accent=saved&&saved.settings&&saved.settings.appearance&&saved.settings.appearance.accent;
    if(typeof accent==='string'&&/^#[0-9a-f]{6}$/i.test(accent)){
      document.documentElement.style.setProperty('--accent-cyan',accent);
      document.documentElement.dataset.omniosAccent=accent;
    }
  }catch(_){}
})();
</script>
<style>
:root{color-scheme:dark;background:#0f0f11;--bg-base:#0f0f11;--bg-surface:#18181b;--bg-elevated:#27272a;--border-light:#3f3f46;--text-primary:#f4f4f5;--text-muted:#71717a;--accent-cyan:#06b6d4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100dvh;background:var(--bg-base);color:var(--text-primary)}
body{overflow:hidden}
.boot{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:24px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.omnios-boot-card{width:min(330px,calc(100vw - 42px));display:flex;flex-direction:column;align-items:center;text-align:center;gap:13px}
.omnios-boot-mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;overflow:hidden;background:var(--bg-surface);border:1px solid var(--border-light);box-shadow:0 12px 38px rgba(0,0,0,.22)}
.omnios-boot-mark:before{content:'';width:21px;height:21px;border:2px solid color-mix(in srgb,var(--accent-cyan) 30%,transparent);border-top-color:var(--accent-cyan);border-radius:50%;animation:omniosBootSpin .8s linear infinite}
.omnios-boot-mark img{width:100%;height:100%;object-fit:cover;display:none;transform-origin:center}
html.omnios-has-boot-icon .omnios-boot-mark:before{display:none}
html.omnios-has-boot-icon .omnios-boot-mark img{display:block;animation:omniosBootIconPulse 1.1s ease-in-out infinite}
.omnios-boot-brand{font-size:1.08rem;font-weight:820;letter-spacing:-.025em}.omnios-boot-brand span{color:var(--accent-cyan)}
.omnios-boot-copy{font-size:.72rem;line-height:1.45;color:var(--text-muted)}
.omnios-boot-track{width:180px;height:3px;border-radius:99px;overflow:hidden;background:var(--bg-elevated)}
.omnios-boot-track i{display:block;width:38%;height:100%;border-radius:inherit;background:var(--accent-cyan);animation:omniosBootBar 1.05s ease-in-out infinite}
#fill,#status{display:none}
.error{display:none;width:min(330px,100%);margin-top:4px;padding:12px;border:1px solid var(--border-light);border-radius:12px;text-align:left;font-size:.75rem}
.boot.failed .error{display:block}.error p{margin:5px 0 0;color:var(--text-muted);line-height:1.4}.error button{margin-top:10px;width:100%;min-height:40px;border:0;border-radius:10px;font-weight:700}
@keyframes omniosBootSpin{to{transform:rotate(360deg)}}@keyframes omniosBootBar{0%{transform:translateX(-115%)}55%{transform:translateX(155%)}100%{transform:translateX(300%)}}@keyframes omniosBootIconPulse{0%,100%{transform:scale(.9);opacity:.82}50%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.omnios-boot-mark:before,.omnios-boot-mark img,.omnios-boot-track i{animation:none}.omnios-boot-track i{width:100%}}
</style>
</head>
<body>
<main class="boot" id="omnios-boot-screen" role="status" aria-live="polite" aria-label="Loading OmniOS">
<div class="omnios-boot-card">
  <div class="omnios-boot-mark" aria-hidden="true"><img id="omnios-index-boot-icon" alt=""></div>
  <div class="omnios-boot-brand">Omni<span>OS</span></div>
  <div class="omnios-boot-copy">Preparing your workspace…</div>
  <div class="omnios-boot-track" aria-hidden="true"><i></i></div>
  <div id="fill"></div><div id="status">Loading 0%</div>
  <div class="error" id="error"><strong>OmniOS couldn't finish loading.</strong><p>Check your connection once, then retry. After the first successful load OmniOS can work offline.</p><button onclick="location.reload()">Retry</button></div>
</div>
</main>
<script>
try{const src=localStorage.getItem('omnios_loading_icon_v1'),img=document.getElementById('omnios-index-boot-icon');if(src&&img){img.src=src;document.documentElement.classList.add('omnios-has-boot-icon')}}catch(_){}
</script>
<script>
(()=>{
const PARTS=["./app-parts/part-001.html","./app-parts/part-002.html?v=mobile-personalization-r5","./app-parts/part-003.html","./app-parts/part-004.html?v=runtime-recovery-r1","./app-parts/part-005.html","./app-parts/part-006.html?v=more-menu-fix-r3","./app-parts/part-007.html?v=more-menu-fix-r3","./app-parts/part-008.html","./app-parts/part-009.html","./app-parts/part-010.html","./app-parts/part-011.html","./app-parts/part-012.html","./app-parts/part-013.html","./app-parts/part-014.html","./app-parts/part-015.html","./app-parts/part-016.html","./app-parts/part-017.html","./app-parts/part-018.html","./app-parts/part-019.html","./app-parts/part-020.html","./app-parts/part-021.html","./app-parts/part-022.html","./app-parts/part-023.html","./app-parts/part-024.html","./app-parts/part-025.html","./app-parts/part-026.html","./app-parts/part-027.html","./app-parts/part-028.html?v=welcome-ux-r2"];
const CACHE='omnios-v62.3-runtime-recovery-r1';
const fill=document.getElementById('fill'),status=document.getElementById('status');

async function fetchFresh(url,timeoutMs){
  const ctrl=typeof AbortController!=='undefined'?new AbortController():null;
  const timer=ctrl?setTimeout(()=>ctrl.abort(),timeoutMs):null;
  try{
    const r=await fetch(url,{signal:ctrl?.signal,cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    try{const cache=await caches.open(CACHE);await cache.put(url,r.clone())}catch(_){}
    return await r.text();
  }finally{
    if(timer)clearTimeout(timer);
  }
}
async function one(url){
  const startupCritical=/part-(001|028)\.html(?:$|\?)/.test(url);
  const cached=await caches.match(url);
  if(cached&&!startupCritical)return await cached.text();
  try{
    return await fetchFresh(url,startupCritical?1800:3200);
  }catch(e){
    if(cached)return await cached.text();
    throw e;
  }
}

function addRootClass(html,className){
  return html.replace(/<html([^>]*)>/i,(full,attrs)=>{
    if(/\bclass\s*=/.test(attrs)){
      return '<html'+attrs.replace(/\bclass\s*=\s*(["'])(.*?)\1/i,(m,q,v)=>'class='+q+v+' '+className+q)+'>';
    }
    return '<html'+attrs+' class="'+className+'">';
  });
}

function carryLoaderIntoApp(html){
  const boot=document.getElementById('omnios-boot-screen');
  const baseStyle=document.querySelector('head style');
  if(!boot||!baseStyle)return html;

  const hasIcon=document.documentElement.classList.contains('omnios-has-boot-icon');
  const rootClasses='omnios-startup-gate'+(hasIcon?' omnios-has-boot-icon':'');
  const gateCss=`
<style id="omnios-startup-gate-css">
${baseStyle.textContent}
html.omnios-startup-gate body{overflow:hidden!important}
html.omnios-startup-gate body>*:not(#omnios-boot-screen){visibility:hidden!important;pointer-events:none!important}
#omnios-boot-screen{background:var(--bg-base,#0f0f11);opacity:1;transition:opacity .18s ease}
#omnios-boot-screen.is-leaving{opacity:0;pointer-events:none}
</style>`;
  const bootHtml=boot.outerHTML;
  let out=addRootClass(html,rootClasses);
  out=out.replace(/<\/head>/i,gateCss+'\n</head>');
  out=out.replace(/<body([^>]*)>/i,(m,attrs)=>'<body'+attrs+'>\n'+bootHtml);
  return out;
}

(async()=>{
  try{
    const texts=new Array(PARTS.length);
    let next=0,done=0;
    const worker=async()=>{
      while(true){
        const i=next++;
        if(i>=PARTS.length)return;
        texts[i]=await one(PARTS[i]);
        done++;
        const pct=Math.round((done/PARTS.length)*100);
        fill.style.width=pct+'%';
        status.textContent='Loading '+pct+'%';
      }
    };
    await Promise.all(Array.from({length:Math.min(6,PARTS.length)},worker));
    const html=carryLoaderIntoApp(texts.join(''));
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    document.querySelector('.boot')?.classList.add('failed');
    document.getElementById('error').style.display='block';
    status.textContent='Load failed';
  }
})();
})();
</script>
</body></html>
