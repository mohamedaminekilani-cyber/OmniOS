<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18181b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OmniOS">
<link id="omnios-apple-touch-icon" rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
<script id="omnios-pwa-icon-early">
(function(){
  function safeImageSrc(value,allowData){
    value=String(value||'').trim();
    if(!value)return '';
    if(allowData&&/^data:image\/(?:png|jpeg|webp);base64,[a-z0-9+/=\s]+$/i.test(value))return value;
    try{
      var u=new URL(value,location.href);
      if(u.origin===location.origin||u.origin==='https://omnios-pwa.netlify.app')return u.href;
    }catch(_){}
    return '';
  }
  window.__omniSafeImageSrc=safeImageSrc;
  try{
    var qs=new URLSearchParams(location.search);
    var id=(qs.get('pwaIcon')||'').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,120);
    var rev=(qs.get('pwaIconRev')||'').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,80);
    var href='';
    if(id)href='https://omnios-pwa.netlify.app/api/icon?id='+encodeURIComponent(id)+(rev?'&v='+encodeURIComponent(rev):'');
    if(!href)href=safeImageSrc(localStorage.getItem('omnios_app_icon_public_v1')||'',false);
    if(href){
      var old=document.getElementById('omnios-apple-touch-icon');if(old)old.remove();
      var link=document.createElement('link');link.id='omnios-apple-touch-icon';link.rel='apple-touch-icon';link.href=href;document.head.appendChild(link);
    }
  }catch(_){}
})();
</script>
<link rel="manifest" href="./manifest.webmanifest">
<title>OmniOS</title>
<script id="omnios-accent-early">
(function(){
  try{
    const saved=JSON.parse(localStorage.getItem('omnios_v3_state')||'null');
    const accent=saved&&saved.settings&&saved.settings.appearance&&saved.settings.appearance.accent;
    if(typeof accent==='string'&&/^#[0-9a-f]{6}$/i.test(accent)){
      document.documentElement.style.setProperty('--accent-cyan',accent);
      document.documentElement.dataset.omniosAccent=accent;
    }
  }catch(_){}
})();
</script>
<style>
:root{color-scheme:dark;background:#0f0f11;--bg-base:#0f0f11;--bg-surface:#18181b;--bg-elevated:#27272a;--border-light:#45454f;--text-primary:#f4f4f5;--text-muted:#92929c;--accent-cyan:#06b6d4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100dvh;background:var(--bg-base);color:var(--text-primary)}
body{overflow:hidden}
.boot{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));font-family:Roboto,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.omnios-boot-card{width:min(360px,calc(100vw - 32px));display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.omnios-boot-mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;overflow:hidden;background:var(--bg-surface);border:1px solid var(--border-light);box-shadow:0 12px 38px rgba(0,0,0,.22)}
.omnios-boot-mark:before{content:'';width:21px;height:21px;border:2px solid color-mix(in srgb,var(--accent-cyan) 30%,transparent);border-top-color:var(--accent-cyan);border-radius:50%;animation:omniosBootSpin .8s linear infinite}
.omnios-boot-mark img{width:100%;height:100%;object-fit:cover;display:none;transform-origin:center}
html.omnios-has-boot-icon .omnios-boot-mark:before{display:none}
html.omnios-has-boot-icon .omnios-boot-mark img{display:block;animation:omniosBootIconPulse 1.1s ease-in-out infinite}
.omnios-boot-brand{font-size:1.08rem;font-weight:820;letter-spacing:-.025em}.omnios-boot-brand span{color:var(--accent-cyan)}
.omnios-boot-copy{font-size:.8rem;line-height:1.5;color:var(--text-muted)}
.omnios-boot-track{width:min(220px,72vw);height:4px;border-radius:99px;overflow:hidden;background:var(--bg-elevated)}
.omnios-boot-track i{display:block;width:0;height:100%;border-radius:inherit;background:var(--accent-cyan);transition:width .18s ease}
#fill{display:none}
#status{display:block;min-height:18px;font-size:.72rem;line-height:1.35;color:var(--text-muted);font-variant-numeric:tabular-nums}
.error{display:none;width:min(360px,100%);margin-top:4px;padding:14px;border:1px solid var(--border-light);border-radius:14px;text-align:left;font-size:.8rem;background:var(--bg-surface)}
.boot.failed .error{display:block}
.boot.failed .omnios-boot-track,.boot.failed .omnios-boot-copy{display:none}
.boot.failed #status{color:#fca5a5}
.error p{margin:6px 0 0;color:var(--text-muted);line-height:1.5}
.error-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.error button{width:100%;min-height:44px;border:1px solid var(--accent-cyan);border-radius:10px;font-weight:700;background:var(--accent-cyan);color:#061015}
.error button.secondary{background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--border-light)}
.error button:disabled{opacity:.55}
@keyframes omniosBootSpin{to{transform:rotate(360deg)}}@keyframes omniosBootIconPulse{0%,100%{transform:scale(.9);opacity:.82}50%{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.omnios-boot-mark:before,.omnios-boot-mark img{animation:none}.omnios-boot-track i{transition:none}}
</style>
</head>
<body>
<main class="boot" id="omnios-boot-screen" role="status" aria-live="polite" aria-label="Loading OmniOS">
<div class="omnios-boot-card">
  <div class="omnios-boot-mark" aria-hidden="true"><img id="omnios-index-boot-icon" alt=""></div>
  <div class="omnios-boot-brand">Omni<span>OS</span></div>
  <div class="omnios-boot-copy">Preparing your workspace…</div>
  <div class="omnios-boot-track" role="progressbar" aria-label="Loading OmniOS" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="omnios-boot-progress"></i></div>
  <div id="fill"></div><div id="status" aria-live="polite">Preparing · 0%</div>
  <div class="error" id="error" role="alert"><strong>OmniOS couldn't finish loading.</strong><p id="omnios-load-error-copy">Check your connection, then retry. A validated offline snapshot will be used automatically when available.</p><div class="error-actions"><button id="omnios-retry-btn" type="button">Retry</button><button id="omnios-reset-cache-btn" type="button" class="secondary">Reset app cache</button></div></div>
</div>
</main>
<script>
try{const raw=localStorage.getItem('omnios_loading_icon_v1')||'',src=window.__omniSafeImageSrc?window.__omniSafeImageSrc(raw,true):'',img=document.getElementById('omnios-index-boot-icon');if(src&&img){img.src=src;document.documentElement.classList.add('omnios-has-boot-icon')}}catch(_){}
</script>
<script>
(()=>{
const PARTS=Array.from({length:28},function(_,i){return './app-parts/part-'+String(i+1).padStart(3,'0')+'.html'});
const SNAPSHOT_PREFIX='omnios-app-snapshot-v1-';
const SNAPSHOT_SLOT_KEY='omnios_app_snapshot_slot_v1';
const SNAPSHOT_META='./__omnios_snapshot_meta__';
const USER_ASSET_CACHE='omnios-user-assets-v1';
const MIN_PART_LENGTH=120000;
const fill=document.getElementById('fill'),status=document.getElementById('status'),progress=document.getElementById('omnios-boot-progress'),track=document.querySelector('.omnios-boot-track');
const retryBtn=document.getElementById('omnios-retry-btn'),resetBtn=document.getElementById('omnios-reset-cache-btn');
function setProgress(done,label){
  const pct=Math.max(0,Math.min(100,Math.round((done/PARTS.length)*100)));
  if(fill)fill.style.width=pct+'%';
  if(progress)progress.style.width=pct+'%';
  if(track)track.setAttribute('aria-valuenow',String(pct));
  if(status)status.textContent=(label||'Loading')+' · '+pct+'%';
}
function retryNow(){
  if(retryBtn){retryBtn.disabled=true;retryBtn.textContent='Retrying…'}
  if(resetBtn)resetBtn.disabled=true;
  const boot=document.querySelector('.boot');boot?.classList.remove('failed');
  if(status)status.textContent=navigator.onLine?'Retrying…':'Offline · checking saved copy…';
  setTimeout(()=>location.reload(),80);
}
retryBtn?.addEventListener('click',retryNow);
resetBtn?.addEventListener('click',()=>{if(resetBtn){resetBtn.disabled=true;resetBtn.textContent='Resetting…'}if(retryBtn)retryBtn.disabled=true;window.resetOmniAppCache?.()});
function hashText(text){
  let h=2166136261;
  for(let i=0;i<text.length;i++)h=Math.imul(h^text.charCodeAt(i),16777619);
  return (h>>>0).toString(36);
}
function validatePart(text,index){
  if(typeof text!=='string'||text.length<MIN_PART_LENGTH)return false;
  if(index===0&&!/^\s*<!doctype html>/i.test(text.slice(0,300)))return false;
  if(index===PARTS.length-1&&!/<\/html>\s*$/i.test(text))return false;
  const head=text.slice(0,4000).toLowerCase();
  if(head.includes('<title>sign in')||head.includes('captive portal')||head.includes('network login'))return false;
  return true;
}
async function fetchAttempt(url,index,timeoutMs){
  const ctrl=typeof AbortController!=='undefined'?new AbortController():null;
  const timer=ctrl?setTimeout(function(){ctrl.abort()},timeoutMs):null;
  try{
    const response=await fetch(url,{signal:ctrl&&ctrl.signal,cache:'no-cache',credentials:'same-origin'});
    if(!response.ok)throw new Error('HTTP '+response.status+' for '+url);
    const finalUrl=new URL(response.url||url,location.href);
    if(finalUrl.origin!==location.origin)throw new Error('Unexpected redirect for '+url);
    const type=(response.headers.get('content-type')||'').toLowerCase();
    if(type&&!type.includes('text/html')&&!type.includes('text/plain'))throw new Error('Unexpected content type for '+url);
    const text=await response.text();
    if(!validatePart(text,index))throw new Error('Content validation failed for '+url);
    return text;
  }finally{
    if(timer)clearTimeout(timer);
  }
}
async function fetchPart(url,index){
  let lastError=null;
  for(const timeoutMs of [10000,20000]){
    try{return await fetchAttempt(url,index,timeoutMs)}catch(e){lastError=e}
  }
  throw lastError||new Error('Could not load '+url);
}
async function fetchFreshSet(){
  const texts=new Array(PARTS.length);
  const errors=[];
  let next=0,done=0;
  async function worker(){
    while(true){
      const index=next++;
      if(index>=PARTS.length)return;
      try{texts[index]=await fetchPart(PARTS[index],index)}
      catch(e){errors.push({index:index,error:e})}
      finally{done++;setProgress(done,'Checking')}
    }
  }
  await Promise.all(Array.from({length:Math.min(6,PARTS.length)},worker));
  if(errors.length){
    const first=errors[0];
    throw new Error((first.error&&first.error.message?first.error.message:'Part load failed')+' ('+errors.length+' part'+(errors.length===1?'':'s')+')');
  }
  return texts;
}
async function readSlot(slot){
  if(!('caches'in window))return null;
  try{
    const cache=await caches.open(SNAPSHOT_PREFIX+slot);
    const metaResponse=await cache.match(SNAPSHOT_META);
    if(!metaResponse)return null;
    const meta=await metaResponse.json();
    if(!meta||meta.version!==1||!Array.isArray(meta.parts)||meta.parts.length!==PARTS.length)return null;
    const texts=new Array(PARTS.length);
    for(let i=0;i<PARTS.length;i++){
      const response=await cache.match(PARTS[i]);
      if(!response)return null;
      const text=await response.text();
      const expected=meta.parts[i]||{};
      if(!validatePart(text,i)||text.length!==expected.length||hashText(text)!==expected.hash)return null;
      texts[i]=text;
    }
    return texts;
  }catch(e){
    console.warn('OmniOS snapshot read failed',e);
    return null;
  }
}
async function readSnapshot(){
  let active='';
  try{active=localStorage.getItem(SNAPSHOT_SLOT_KEY)||''}catch(_){}
  const order=active==='a'?['a','b']:active==='b'?['b','a']:['a','b'];
  for(const slot of order){
    const texts=await readSlot(slot);
    if(texts){
      try{localStorage.setItem(SNAPSHOT_SLOT_KEY,slot)}catch(_){}
      return texts;
    }
  }
  return null;
}
async function writeSnapshot(texts){
  if(!('caches'in window))return false;
  let active='';
  try{active=localStorage.getItem(SNAPSHOT_SLOT_KEY)||''}catch(_){}
  const target=active==='a'?'b':'a';
  const name=SNAPSHOT_PREFIX+target;
  try{
    await caches.delete(name);
    const cache=await caches.open(name);
    const meta={version:1,savedAt:new Date().toISOString(),parts:[]};
    for(let i=0;i<PARTS.length;i++){
      const text=texts[i];
      meta.parts.push({length:text.length,hash:hashText(text)});
      await cache.put(PARTS[i],new Response(text,{headers:{'Content-Type':'text/html; charset=utf-8','Cache-Control':'no-store'}}));
    }
    await cache.put(SNAPSHOT_META,new Response(JSON.stringify(meta),{headers:{'Content-Type':'application/json','Cache-Control':'no-store'}}));
    const verified=await readSlot(target);
    if(!verified)throw new Error('Snapshot verification failed');
    try{localStorage.setItem(SNAPSHOT_SLOT_KEY,target)}catch(_){}
    return true;
  }catch(e){
    console.warn('OmniOS snapshot write failed',e);
    try{await caches.delete(name)}catch(_){}
    return false;
  }
}
window.resetOmniAppCache=async function(){
  try{
    if('caches'in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(function(k){return k!==USER_ASSET_CACHE&&(k.indexOf('omnios-')===0||k.indexOf('omnios-app-')===0)}).map(function(k){return caches.delete(k)}));
    }
    try{localStorage.removeItem(SNAPSHOT_SLOT_KEY)}catch(_){}
    try{
      const reg=await navigator.serviceWorker?.getRegistration?.();
      await reg?.update?.();
    }catch(_){}
  }finally{
    location.reload();
  }
};

function addRootClass(html,className){
  return html.replace(/<html([^>]*)>/i,function(full,attrs){
    if(/\bclass\s*=/.test(attrs)){
      return '<html'+attrs.replace(/\bclass\s*=\s*(["'])(.*?)\1/i,function(m,q,v){return 'class='+q+v+' '+className+q})+'>';
    }
    return '<html'+attrs+' class="'+className+'">';
  });
}
function carryLoaderIntoApp(html){
  const boot=document.getElementById('omnios-boot-screen');
  const baseStyle=document.querySelector('head style');
  if(!boot||!baseStyle)return html;
  const hasIcon=document.documentElement.classList.contains('omnios-has-boot-icon');
  const rootClasses='omnios-startup-gate'+(hasIcon?' omnios-has-boot-icon':'');
  const gateCss='\n<style id="omnios-startup-gate-css">\n'+baseStyle.textContent+'\nhtml.omnios-startup-gate body{overflow:hidden!important}\nhtml.omnios-startup-gate body>*:not(#omnios-boot-screen){visibility:hidden!important;pointer-events:none!important}\n#omnios-boot-screen{background:var(--bg-base,#0f0f11);opacity:1;transition:opacity .18s ease}\n#omnios-boot-screen.is-leaving{opacity:0;pointer-events:none}\n</style>';
  const bootHtml=boot.outerHTML;
  let out=addRootClass(html,rootClasses);
  out=out.replace(/<\/head>/i,gateCss+'\n</head>');
  out=out.replace(/<body([^>]*)>/i,function(m,attrs){return '<body'+attrs+'>\n'+bootHtml});
  return out;
}

(async()=>{
  try{
    let texts=null;
    let freshError=null;
    try{
      texts=await fetchFreshSet();
      setProgress(PARTS.length,'Validated');
      await writeSnapshot(texts);
    }catch(e){
      freshError=e;
      console.warn('Fresh OmniOS load failed; trying complete snapshot',e);
      if(status)status.textContent=navigator.onLine?'Fresh build unavailable · opening saved copy…':'Offline · opening saved copy…';
      if(progress)progress.style.width='100%';
      texts=await readSnapshot();
    }
    if(!texts)throw freshError||new Error('No validated app snapshot is available');
    const html=carryLoaderIntoApp(texts.join(''));
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    document.querySelector('.boot')?.classList.add('failed');
    const copy=document.getElementById('omnios-load-error-copy');
    const offline=!navigator.onLine;
    if(copy)copy.textContent=offline
      ? 'This device is offline and no complete saved app copy was available. Reconnect once, then Retry. Your OmniOS data is not deleted.'
      : 'A complete app build could not be validated. Retry first; if it repeats, reset only the app cache. Your OmniOS data is not deleted.';
    const error=document.getElementById('error');if(error)error.style.display='block';
    if(status)status.textContent=offline?'Offline · saved copy unavailable':'Load failed · app files could not be validated';
    retryBtn?.focus?.();
  }
})();
})();
</script>

</body></html>
