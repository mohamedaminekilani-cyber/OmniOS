<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18181b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OmniOS">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>OmniOS</title>
<style>
:root{color-scheme:dark;background:#0f0f11;--bg-base:#0f0f11;--bg-surface:#18181b;--bg-elevated:#27272a;--border-light:#3f3f46;--text-primary:#f4f4f5;--text-muted:#71717a;--accent-cyan:#06b6d4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100dvh;background:var(--bg-base);color:var(--text-primary)}
body{overflow:hidden}
.boot{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:24px;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.omnios-boot-card{width:min(330px,calc(100vw - 42px));display:flex;flex-direction:column;align-items:center;text-align:center;gap:13px}
.omnios-boot-mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;overflow:hidden;background:var(--bg-surface);border:1px solid var(--border-light);box-shadow:0 12px 38px rgba(0,0,0,.22)}
.omnios-boot-mark:before{content:'';width:21px;height:21px;border:2px solid color-mix(in srgb,var(--accent-cyan) 30%,transparent);border-top-color:var(--accent-cyan);border-radius:50%;animation:omniosBootSpin .8s linear infinite}
.omnios-boot-mark img{width:100%;height:100%;object-fit:cover;display:none}
html.omnios-has-boot-icon .omnios-boot-mark:before{display:none}
html.omnios-has-boot-icon .omnios-boot-mark img{display:block}
.omnios-boot-brand{font-size:1.08rem;font-weight:820;letter-spacing:-.025em}.omnios-boot-brand span{color:var(--accent-cyan)}
.omnios-boot-copy{font-size:.72rem;line-height:1.45;color:var(--text-muted)}
.omnios-boot-track{width:180px;height:3px;border-radius:99px;overflow:hidden;background:var(--bg-elevated)}
.omnios-boot-track i{display:block;width:38%;height:100%;border-radius:inherit;background:var(--accent-cyan);animation:omniosBootBar 1.05s ease-in-out infinite}
#fill,#status{display:none}
.error{display:none;width:min(330px,100%);margin-top:4px;padding:12px;border:1px solid var(--border-light);border-radius:12px;text-align:left;font-size:.75rem}
.boot.failed .error{display:block}.error p{margin:5px 0 0;color:var(--text-muted);line-height:1.4}.error button{margin-top:10px;width:100%;min-height:40px;border:0;border-radius:10px;font-weight:700}
@keyframes omniosBootSpin{to{transform:rotate(360deg)}}@keyframes omniosBootBar{0%{transform:translateX(-115%)}55%{transform:translateX(155%)}100%{transform:translateX(300%)}}
@media(prefers-reduced-motion:reduce){.omnios-boot-mark:before,.omnios-boot-track i{animation:none}.omnios-boot-track i{width:100%}}
</style>
</head>
<body>
<main class="boot" id="omnios-boot-screen" role="status" aria-live="polite" aria-label="Loading OmniOS">
<div class="omnios-boot-card">
  <div class="omnios-boot-mark" aria-hidden="true"><img id="omnios-index-boot-icon" alt=""></div>
  <div class="omnios-boot-brand">Omni<span>OS</span></div>
  <div class="omnios-boot-copy">Preparing your workspace…</div>
  <div class="omnios-boot-track" aria-hidden="true"><i></i></div>
  <div id="fill"></div><div id="status">Loading 0%</div>
  <div class="error" id="error"><strong>OmniOS couldn't finish loading.</strong><p>Check your connection once, then retry. After the first successful load OmniOS can work offline.</p><button onclick="location.reload()">Retry</button></div>
</div>
</main>
<script>
try{const src=localStorage.getItem('omnios_loading_icon_v1'),img=document.getElementById('omnios-index-boot-icon');if(src&&img){img.src=src;document.documentElement.classList.add('omnios-has-boot-icon')}}catch(_){}
</script>
<script>
(()=>{const PARTS=["./app-parts/part-001.html","./app-parts/part-002.html","./app-parts/part-003.html","./app-parts/part-004.html","./app-parts/part-005.html","./app-parts/part-006.html","./app-parts/part-007.html","./app-parts/part-008.html","./app-parts/part-009.html","./app-parts/part-010.html","./app-parts/part-011.html","./app-parts/part-012.html","./app-parts/part-013.html","./app-parts/part-014.html","./app-parts/part-015.html","./app-parts/part-016.html","./app-parts/part-017.html","./app-parts/part-018.html","./app-parts/part-019.html","./app-parts/part-020.html","./app-parts/part-021.html","./app-parts/part-022.html","./app-parts/part-023.html","./app-parts/part-024.html","./app-parts/part-025.html","./app-parts/part-026.html","./app-parts/part-027.html","./app-parts/part-028.html"],CACHE='omnios-v62.3-push-personalization-r2',fill=document.getElementById('fill'),status=document.getElementById('status');
async function one(url){try{const r=await fetch(url);if(!r.ok)throw new Error(r.status);try{const c=await caches.open(CACHE);await c.put(url,r.clone())}catch{}return await r.text()}catch(e){const c=await caches.match(url);if(c)return await c.text();throw e}}
(async()=>{try{const texts=new Array(PARTS.length);let next=0,done=0;const worker=async()=>{while(true){const i=next++;if(i>=PARTS.length)return;texts[i]=await one(PARTS[i]);done++;const pct=Math.round((done/PARTS.length)*100);fill.style.width=pct+'%';status.textContent='Loading '+pct+'%'}};await Promise.all(Array.from({length:Math.min(6,PARTS.length)},worker));const html=texts.join('');document.open();document.write(html);document.close()}catch(e){console.error(e);document.querySelector('.boot')?.classList.add('failed');document.getElementById('error').style.display='block';status.textContent='Load failed'}})()})();
</script>
</body></html>
