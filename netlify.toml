[build]
  command = "npm test && npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
[[headers]]
  for = "/release.json"
  [headers.values]
    Cache-Control = "no-store"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
